/* ===================== Eventos ===================== */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(a==="fondo" && e.target!==el) return;
  const r=S.rep;
  switch(a){
    case "tab": S.view=d.v; cerrarCapa(); render(); window.scrollTo(0,0); break;
    case "theme": { const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; LS.set("tema",nx); break; }
    case "fondo": case "cerrar": cerrarCapa(); break;
    case "cat": S.cat=d.c; render(); break;
    case "leer": abrirLectura(d.id); break;
    case "elegir": abrirSelector(+d.pi); break;
    case "agregar": { const p=r.p[S._pi]; if(!p.s.includes(d.id)) p.s.push(d.id); guardarBorrador(); cerrarCapa(); render(); break; }
    case "quitarCanto": r.p[+d.pi].s.splice(+d.si,1); guardarBorrador(); render(); break;
    case "subir": { const s=r.p[+d.pi].s, i=+d.si; [s[i-1],s[i]]=[s[i],s[i-1]]; guardarBorrador(); render(); break; }
    case "quitarParte": r.p.splice(+d.pi,1); guardarBorrador(); render(); break;
    case "elegirMisa": abrirMisas(); break;
    case "pcol": S._pcol=d.v; pintarSelector(); break;
    case "misa": aplicarMisa(+d.i); break;
    case "vaciar": if(confirm("¿Borrar este repertorio y empezar uno nuevo?")){S.rep=nuevoRep();guardarBorrador();render()} break;
    case "cantar": { const rep = S.mode==="edit" || !S.shared ? S.rep : S.shared; abrirCoro(rep,+d.i||0); break; }
    case "mover": moverCoro(+d.d); break;
    case "ir": S._coro.i=+d.i; S._coro.idx=false; pintarCoro(true); break;
    case "indice": S._coro.idx=!S._coro.idx; pintarCoro(false); break;
    case "lec": S.lec=Math.max(.95,Math.min(2.4,+(S.lec+(+d.d)*.12).toFixed(2))); LS.set("lec",S.lec); document.getElementById("coroB").style.setProperty("--lec",S.lec+"rem"); pintarPartituras(document.getElementById("coroB"), zoomCoro()); break;
    case "coroR": S.coroR=d.v==="1"; LS.set("coroR",S.coroR); pintarCoro(false); break;
    case "compartir": abrirCompartir(); break;
    case "copiar": { const t=document.getElementById("lnk"); t.select();
      try{ await navigator.clipboard.writeText(t.value); toast("Enlace copiado."); }
      catch{ try{ document.execCommand("copy"); toast("Enlace copiado."); }catch{ toast("Seleccioná el enlace y copialo manualmente."); } }
      break; }
    case "enviar": {
      // El enlace va dentro del texto: algunas apps (Telegram, WhatsApp) descartan el campo url
      const link=document.getElementById("lnk").value;
      const titulo=S.rep.t||"Repertorio de la Misa";
      const fecha=S.rep.d?fechaLarga(S.rep.d):"";
      const texto=titulo+(fecha?"\n"+fecha.charAt(0).toUpperCase()+fecha.slice(1):"")+"\n\n"+link;
      try{ await navigator.share({text:texto}); }
      catch(err){ if(err && err.name!=="AbortError"){ try{ await navigator.clipboard.writeText(link); toast("No se pudo abrir el menú para compartir. El enlace quedó copiado."); }catch{ toast("No se pudo abrir el menú para compartir. Usá «Copiar enlace»."); } } }
      break; }
    case "modoDir": S.dir=!S.dir; LS.set("director",S.dir); render(); break;
    case "exportar": exportar(); break;
    case "ocultarCanto": ocultarCanto(d.id); break;
    case "editarDesde": { const src=S.shared||vigente; if(src) S.rep=JSON.parse(JSON.stringify({t:src.t,d:src.d,p:src.p})); S.mode="edit"; guardarBorrador(); render(); break; }
    case "salirEdicion": S.mode="read"; render(); break;
    case "nuevoCanto": abrirFormCanto(null); break;
    case "editarCanto": abrirFormCanto(d.id); break;
    case "guardarCanto": guardarCanto(d.id); break;
  }
});
document.addEventListener("keydown",e=>{ const el=e.target.closest?.("li[data-act]"); if(el && (e.key==="Enter"||e.key===" ")){e.preventDefault();el.click()} });
document.addEventListener("input",e=>{
  const el=e.target, k=el.dataset?.in; if(!k) return;
  if(k==="q"){S.q=el.value;S._focusQ=true;renderLib();return}
  if(k==="t"||k==="d"){S.rep[k]=el.value;guardarBorrador();return}
  if(k==="nota"){S.rep.p[+el.dataset.pi].nota=el.value;guardarBorrador();return}
});

function fuentesListas(){ if(!_fuentes) _fuentes=(document.fonts&&document.fonts.load? Promise.all([document.fonts.load("400 20px Alegreya"),document.fonts.load("italic 400 20px Alegreya")]).catch(()=>{}) : Promise.resolve()).then(()=>new Promise(r=>setTimeout(r,0))); return _fuentes; }
function svgPartitura(gid, ancho){
  const clave=gid+"@"+ancho;
  if(_svgCache.has(clave)) return Promise.resolve(_svgCache.get(clave));
  if(_enCurso.has(clave)) return _enCurso.get(clave);
  const p=fuentesListas().then(()=>new Promise((ok,mal)=>{
    try{
      const g=GREG.gabc[gid]; if(!g || !window.exsurge) return mal(new Error("sin partitura"));
      const ctxt=contextoExsurge();
      const score=new exsurge.ChantScore(ctxt, exsurge.Gabc.createMappingsFromSource(ctxt, gabcParaExsurge(gabcCuerpo(g))), true);
      const modo=gabcModo(g); if(modo) score.annotation=new exsurge.Annotations(ctxt,'%'+ROMANO_MODO[modo]+'%');
      ctxt.width=ancho;
      score.performLayoutAsync(ctxt,()=>score.layoutChantLines(ctxt,ancho,()=>{
        const svg=score.createSvgNode(ctxt);
        const w=parseFloat(svg.getAttribute("width")), h=parseFloat(svg.getAttribute("height"));
        if(!svg.getAttribute("viewBox") && w && h) svg.setAttribute("viewBox","0 0 "+w+" "+h);
        svg.removeAttribute("width"); svg.removeAttribute("height");
        const html=svg.outerHTML; _svgCache.set(clave,html); _enCurso.delete(clave); ok(html);
      }));
    }catch(err){ _enCurso.delete(clave); mal(err); }
  }));
  _enCurso.set(clave,p); return p;
}
function anchoMaqueta(el, zoom){ const w=el.clientWidth || Math.min(window.innerWidth-40,680); return Math.max(260, Math.round(w/(zoom||1)/10)*10); }
function zoomCoro(){ return S.lec/1.15; }   // con la letra por defecto, la partitura sale un poco más grande que en Chant Tools
function pintarPartituras(raiz, zoom){
  const els=[...(raiz||document).querySelectorAll(".partitura[data-g]")];
  return Promise.all(els.map(el=>{
    const gid=el.dataset.g, ancho=anchoMaqueta(el,zoom);
    el.dataset.w=ancho;
    return svgPartitura(gid,ancho).then(html=>{ if(el.isConnected && el.dataset.w==String(ancho)) el.innerHTML=html; })
      .catch(()=>{ if(el.isConnected) el.innerHTML=`<p class="cargando">No se pudo dibujar la partitura.</p>`; });
  }));
}
// Precarga: mientras se canta, se prepara la partitura del canto siguiente
function precargarSiguiente(){
  const c=S._coro; if(!c) return; const sig=c.items[c.i+1];
  if(!sig || !sig.c || !sig.c.greg) return;
  const art=document.querySelector("#coroB .canto"); if(!art) return;
  const cs=getComputedStyle(art), interior=art.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ancho=Math.max(260, Math.round(interior/zoomCoro()/10)*10);
  const correr=()=>(sig.c.segs||[["g",sig.c.gid]]).filter(x=>x[0]==="g").reduce((p,[,k])=>p.then(()=>svgPartitura(k, ancho).catch(()=>{})), Promise.resolve());
  setTimeout(()=>{ if(window.requestIdleCallback) requestIdleCallback(correr,{timeout:1500}); else correr(); }, 400);
}
let _rz=null;
window.addEventListener("resize",()=>{ clearTimeout(_rz); _rz=setTimeout(()=>{
  const b=document.getElementById("coroB"); if(b) pintarPartituras(b, zoomCoro()); else if($layer.querySelector(".sheet .partitura")) pintarPartituras($layer,1);
},250); });

/* ===================== Inicio ===================== */
function slugCat(nombre){
  const n=nombre.trim(); if(!n) return "";
  const k=Object.keys(CATS).find(k=>norm(CATS[k].n)===norm(n)||k===n); if(k) return k;
  const slug=norm(n).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  CATS[slug]={n, p:[]}; return slug;
}
function parteDe(txt){
  let x=norm(txt).trim(); if(!x) return null;
  x=({sanctus:"santo","agnus dei":"cordero de dios",agnus:"cordero de dios",introito:"entrada",communio:"comunion",offertorium:"ofertorio"})[x]||x;
  const p=PARTES.find(p=>norm(p.n)===x||p.k===x) || PARTES.find(p=>norm(p.n).startsWith(x)||x.startsWith(norm(p.n)));
  return p?p.k:null;
}
const CLAVES={numero:"numero",n:"numero",no:"numero",titulo:"titulo",categoria:"categoria",partes:"partes",partessugeridas:"partes",visible:"visible",tipo:"tipo",modo:"modo"};
function normalizarGabc(cuerpo,modo){
  let g=String(cuerpo||"").replace(/[‘’]/g,"'").replace(/[“”]/g,'"').trim();
  const md=String(modo||"").match(/[1-8]/);
  if(g.indexOf("%%")<0) g="%%\n"+g;
  if(md && !/^mode:/m.test(g.slice(0,g.indexOf("%%")))) g="mode:"+md[0]+";\n"+g;
  return g+"\n";
}
function parseCSV(t){
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<t.length;i++){
    const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){f+='"';i++} else q=false } else f+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(f); f=""; }
    else if(ch==='\n'){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(ch!=='\r') f+=ch;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function leerPlanillas(planillas){
  const ocultos=new Set(), avisos=[];
  (planillas||[]).filter(p=>norm(p.nombre).startsWith("gregorianos")).forEach(p=>{
    const filas=parseCSV(String(p.csv||"").replace(/^\uFEFF/,""));
    const hi=filas.findIndex(r=>r.some(x=>norm(x).trim()==="codigo"));
    if(hi<0){ avisos.push(`«${p.nombre}»: no tiene la columna «Código».`); return; }
    const h=filas[hi].map(x=>norm(x).trim()), ic=h.indexOf("codigo"), iv=h.indexOf("visible");
    if(iv<0){ avisos.push(`«${p.nombre}»: no tiene la columna «Visible».`); return; }
    filas.slice(hi+1).forEach(r=>{ const c=(r[ic]||"").trim(); if(c && ["no","n","0"].includes(norm(r[iv]||"").trim())) ocultos.add(c); });
  });
  return {ocultos, avisos};
}
function registrarGregorianos(lista){
  (lista||[]).forEach(c=>{
    if(!c.greg || !c.gabc) return;
    if(GREG.gabc[c.gid]!==c.gabc){ GREG.gabc[c.gid]=c.gabc; [..._svgCache.keys()].forEach(k=>{ if(k.startsWith(c.gid+"@")) _svgCache.delete(k); }); }
  });
}
function leerArchivo(nombre,texto){
  const lineas=String(texto||"").replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").replace(/\u000b/g,"\n").split("\n");
  const datos={}; let i=0;
  while(i<lineas.length && !lineas[i].trim()) i++;
  for(;i<lineas.length;i++){
    const l=lineas[i].trim();
    if(!l){ continue; }
    if(/^[-—–_=\s]+$/.test(l)){ i++; break; }                      // separador (---, —, etc.)
    const m=l.match(/^([^:]{1,25}):\s*(.*)$/);
    const k=m && CLAVES[norm(m[1]).replace(/[^a-z]/g,"")];
    if(!k) break;                                                   // empieza la letra
    datos[k]=m[2].trim();
  }
  return {datos, cuerpo:lineas.slice(i).join("\n").trim()};
}
function desdeArchivos(lista){
  const avisos=[], cantos=[], vistos=new Map();
  lista.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es",{numeric:true}));
  for(const a of lista){
    const ref=`«${a.nombre}»`;
    const {datos,cuerpo}=leerArchivo(a.nombre,a.texto);
    let n=parseInt(datos.numero,10);
    if(isNaN(n)){ const m=a.nombre.match(/^\s*(\d+)/); if(m) n=parseInt(m[1],10); }
    if(isNaN(n)){ avisos.push(`${ref}: falta el número.`); continue; }
    if(vistos.has(n)){ avisos.push(`${ref}: el número ${n} ya lo usa «${vistos.get(n)}».`); continue; }
    const tit=datos.titulo || a.nombre.replace(/^\s*\d+\s*[-–.]?\s*/,"").replace(/\.txt$/i,"").trim();
    if(!tit){ avisos.push(`${ref}: falta el título.`); continue; }
    if(!cuerpo) avisos.push(`${ref}: no tiene letra cargada.`);
    vistos.set(n,a.nombre);
    const esGreg=norm(datos.tipo||"").startsWith("gregor");
    const c=esGreg
      ? {id:String(n), n, t:tit, c:slugCat(datos.categoria||"")||"gregoriano-propios", e:[], greg:true, propio:true, gid:"d"+n, gabc:normalizarGabc(cuerpo,datos.modo), sub:"", f:""}
      : {id:String(n), n, t:tit, c:slugCat(datos.categoria||"")||"sin-categoria", e:parsearTexto(cuerpo)};
    if(c.c==="sin-categoria"&&!CATS["sin-categoria"]) CATS["sin-categoria"]={n:"Sin categoría",p:[]};
    if(!datos.categoria && !esGreg) avisos.push(`${ref}: falta la categoría.`);
    if(esGreg && !/\([^)]*\)/.test(cuerpo)) avisos.push(`${ref}: está marcado como gregoriano pero el cuerpo no parece GABC.`);
    const keys=[]; (datos.partes||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const k=parteDe(x); if(k) keys.push(k); else avisos.push(`${ref}: no se reconoce la parte «${x}».`)});
    if(keys.length) c.p=keys;
    if(["no","n","0","oculto"].includes(norm(datos.visible||""))) c.oculto=true;
    if(!esGreg && c.e.length && !c.e.some(x=>x[0]==="v") && c.e.length>1) avisos.push(`${ref}: ninguna estrofa tiene número; revisar que no se haya convertido en lista automática.`);
    cantos.push(c);
  }
  return {cantos, avisos};
}
async function cargarCantoral(){
  if(!FUENTE.startsWith("http")) return false;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),60000);
    const r=await fetch(FUENTE,{cache:"no-store",signal:ctl.signal}); clearTimeout(tm);
    if(!r.ok) return false;
    const data=await r.json();
    const {cantos:lista,avisos}=desdeArchivos(data.archivos||[]);
    const pl=leerPlanillas(data.planillas);
    AVISOS=[...(data.errores||[]),...avisos,...pl.avisos];
    if(!lista.length) return false;
    OCULTOS=pl.ocultos;
    BASE=lista; registrarGregorianos(BASE); _cache=null;
    LS.set("cache",{c:lista,a:AVISOS,cats:CATS,o:[...OCULTOS],t:Date.now()});
    return true;
  }catch{ return false; }
}
function refrescar(){
  _cache=null; render();
  if(S._enCoro && S._coro){ S._coro.items=secuencia(S._coro.rep); pintarCoro(false); }
  if(document.getElementById("picklist")) pintarSelector();
}
(async function(){
  const t=LS.get("tema",null); if(t) document.documentElement.dataset.theme=t;
  try{ localStorage.removeItem("cantoral:locales"); localStorage.removeItem("cantoral:director"); }catch{}
  // 1) La última versión guardada en este dispositivo, para abrir al instante
  const cache=LS.get("cache",null);
  if(cache && Array.isArray(cache.c) && cache.c.length){ Object.assign(CATS,cache.cats||{}); BASE=cache.c; AVISOS=cache.a||[]; OCULTOS=new Set(cache.o||[]); registrarGregorianos(BASE); }
  const rep=enlaceARep(); if(rep){S.shared=rep;S.mode="read"}
  // 2) La planilla: si no hay nada guardado, se espera; si lo hay, se actualiza después
  render();
  if(rep && secuencia(rep).length) abrirCoro(rep,0);
  if(await cargarCantoral()) refrescar(); else if(AVISOS.length) render();
})();
window.addEventListener("hashchange",()=>{ const rep=enlaceARep(); if(rep){S.shared=rep;S.mode="read";S.view="rep";cerrarCapa();render();abrirCoro(rep,0);} });
</script>
