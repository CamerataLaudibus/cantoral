          ${si>0?`<button class="mini" data-act="subir" data-pi="${pi}" data-si="${si}" aria-label="Subir">↑</button>`:""}
          <button class="mini" data-act="leer" data-id="${esc(id)}">Ver</button>
          <button class="mini" data-act="quitarCanto" data-pi="${pi}" data-si="${si}" aria-label="Quitar canto">✕</button>
        </div>`}).join("")}</div>`:""}
      <button class="add-canto" data-act="elegir" data-pi="${pi}">${p.s.length?"+ Otro canto para esta parte":"+ Elegir canto"}</button>
      <input class="nota" data-in="nota" data-pi="${pi}" placeholder="Indicación (p. ej. estrofas 1, 3 y 5)" value="${esc(p.nota)}">
    </li>`).join("")}
  </ol>
  ${libres.length?`<div style="margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <select class="field" style="max-width:280px" id="nuevaParte" aria-label="Agregar parte de la Misa">
      <option value="">Agregar parte de la Misa…</option>
      ${libres.map(p=>`<option value="${p.k}">${esc(p.n)}</option>`).join("")}
    </select></div>`:""}
  `;
  const hay = secuencia(r).length>0;
  $bar.innerHTML = `<div class="actions"><div class="actions-in">
    <button class="btn primary" data-act="cantar" data-i="0" ${hay?"":"disabled"}>Cantar</button>
    <button class="btn" data-act="compartir" ${hay?"":"disabled"}>Enviar al coro</button>
    <span class="grow"></span>
    ${(S.shared||vigente)?`<button class="btn ghost" data-act="salirEdicion">Volver</button>`:""}
    <button class="btn ghost" data-act="vaciar">Empezar de nuevo</button>
  </div></div>`;
  const sel=document.getElementById("nuevaParte");
  if(sel) sel.onchange=()=>{ if(!sel.value) return; r.p.push({k:sel.value,s:[],nota:""}); r.p.sort((a,b)=>(PARTE[a.k]?.i??99)-(PARTE[b.k]?.i??99)); guardarBorrador(); render(); };
}

function renderLib(){
  const lista=cantos().filter(c=>(!S.cat||c.c===S.cat)&&busca(c,S.q));
  const cats=[...new Set(cantos().map(c=>c.c))];
  const porCat={}; lista.forEach(c=>(porCat[c.c]=porCat[c.c]||[]).push(c));
  $main.innerHTML = `
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="field" type="search" data-in="q" placeholder="Buscar por título, número o letra" value="${esc(S.q)}" aria-label="Buscar">
  </div>
  <div class="filtros">
    <button data-act="cat" data-c="" aria-pressed="${!S.cat}">Todos</button>
    ${cats.map(k=>`<button data-act="cat" data-c="${esc(k)}" aria-pressed="${S.cat===k}">${esc(catNombre(k))}</button>`).join("")}
  </div>
  ${lista.length? Object.entries(porCat).map(([k,arr])=>`
    <h3 class="cat">${esc(catNombre(k))}</h3>
    <ul class="lista">${arr.map(c=>filaCanto(c,"leer")).join("")}</ul>`).join("")
    : `<p class="empty">Ningún canto coincide con «${esc(S.q)}».</p>`}
  `;
  $main.insertAdjacentHTML("beforeend",`
    ${AVISOS.length?`<details class="notice" style="margin-top:36px"><summary><b>${AVISOS.length===1?"Hay un canto":`Hay ${AVISOS.length} avisos`} para revisar en la carpeta</b></summary>
      <ul style="margin:8px 0 0;padding-left:20px">${AVISOS.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></details>`:""}
    ${CARPETA_URL.startsWith("http")?`<p style="text-align:center;margin-top:36px"><a class="btn ghost" href="${esc(CARPETA_URL)}" target="_blank" rel="noopener">Abrir la carpeta de cantos ↗</a></p>`:""}`);
  $bar.innerHTML = "";
  const inp=$main.querySelector('[data-in="q"]'); if(inp && document.activeElement?.dataset?.in!=="q" && S._focusQ){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);S._focusQ=false}
}
function filaCanto(c,act,extraAttr=""){
  return `<li><button data-act="${act}" data-id="${esc(c.id)}" ${extraAttr}>
    <span class="n">${esc(c.n)}</span>
    <span class="tt-wrap"><span class="t">${esc(c.t)}</span><span class="f">${esc(primerVerso(c))}</span></span>
    <span class="tag">${act==="agregar"?'<span class="add" aria-hidden="true">+</span>':""}</span>
  </button></li>`;
}

/* ===================== Texto del canto ===================== */
function htmlCanto(c,nota){
  if(!c) return `<p class="empty">No se encontró este canto en el cantoral.</p>`;
  let e=c.e||[];
  if(S.coroR && S._enCoro){
    const r=e.find(x=>x[0]==="r"), hayV=e.some(x=>x[0]==="v");
    if(r && hayV){
      const out=[]; const inicio = e[0][0]==="r";
      if(inicio) out.push(r);
      e.forEach(x=>{ if(x[0]==="v"||x[0]==="l"){ out.push(x); if(x[0]==="v") out.push(r); } });
      if(inicio) out.pop(), out.push(r);
      e=out.filter((x,i,a)=>!(x===r && a[i-1]===r));
    }
  }
  return `<article class="canto">
    <div class="enc"><span class="versal">${esc(c.n)}</span>
      <div><h1>${esc(c.t)}</h1><div class="cat">${esc(catNombre(c.c))}</div></div></div>
    ${nota?`<p class="obs">${esc(nota)}</p>`:""}
    ${e.map(x=> x[0]==="v" ? `<p class="b v"><span class="k">${x[1]}.</span>${esc(x[2])}</p>`
             : x[0]==="r" ? `<p class="b r"><span class="k" aria-label="Estribillo">℟.</span>${esc(x[2])}</p>`
             : `<p class="b l">${esc(x[2])}</p>`).join("")}
  </article>`;
}

/* ===================== Hojas ===================== */
function cerrarCapa(){$layer.innerHTML="";S._enCoro=false;document.removeEventListener("keydown",teclasCoro)}
function hoja(titulo,cuerpo,pie=""){
  $layer.innerHTML=`<div class="sheet-bg" data-act="fondo"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
    <div class="sheet-h"><h3>${esc(titulo)}</h3><button class="iconbtn" data-act="cerrar" aria-label="Cerrar">✕</button></div>
    <div class="sheet-b">${cuerpo}</div>${pie?`<div class="sheet-f">${pie}</div>`:""}</div></div>`;
}

function abrirSelector(pi){
  S._pi=pi; S._pq="";
  hoja(`Elegir canto · ${PARTE[S.rep.p[pi].k]?.n}`,`
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input class="field" type="search" id="pq" placeholder="Buscar en todo el cantoral" aria-label="Buscar"></div>
    <div id="picklist"></div>`);
  pintarSelector();
  const pq=document.getElementById("pq"); pq.oninput=()=>{S._pq=pq.value;pintarSelector()};
}
function pintarSelector(){
  const parte=S.rep.p[S._pi]; if(!parte) return;
  const q=S._pq, ya=new Set(parte.s);
  const all=cantos().filter(c=>busca(c,q));
  const sug=all.filter(c=>sugeridas(c).includes(parte.k));
  const resto=all.filter(c=>!sugeridas(c).includes(parte.k));
  const porCat={}; resto.forEach(c=>(porCat[c.c]=porCat[c.c]||[]).push(c));
  const fila=c=>filaCanto(c,"agregar").replace("<li>",`<li class="${ya.has(c.id)?"in":""}">`);
  document.getElementById("picklist").innerHTML = `
    ${sug.length?`<div class="grp">Sugeridos para ${esc(PARTE[parte.k].n)}</div><ul class="lista pick">${sug.map(fila).join("")}</ul>`:""}
    ${Object.entries(porCat).map(([k,arr])=>`<div class="grp">${esc(catNombre(k))} <small>también se puede usar</small></div><ul class="lista pick">${arr.map(fila).join("")}</ul>`).join("")}
    ${!all.length?`<p class="empty">Ningún canto coincide con la búsqueda.</p>`:""}`;
}

function abrirLectura(id){
  const c=canto(id); if(!c) return;
  const partes = sugeridas(c).map(k=>PARTE[k]?.n).filter(Boolean).join(", ");
  hoja(`Canto ${c.n}`, htmlCanto(c) + `<p class="hint">Sugerido para: ${esc(partes||"—")}</p>`,
    "");
  $layer.querySelector(".sheet .canto").style.fontSize="1.15rem";
}

function abrirFormCanto(id){
  const c=id?canto(id):null;
  const n = c? c.n : Math.max(0,...cantos().map(x=>+x.n||0))+1;
  const sug = c? sugeridas(c) : [];
  const cats=Object.keys(CATS);
  hoja(c?`Editar canto ${c.n}`:"Agregar canto",`
    <label class="lbl" for="fT">Título</label>
    <input class="field" id="fT" value="${esc(c?.t||"")}">
    <div style="display:grid;grid-template-columns:110px 1fr;gap:12px">
      <div><label class="lbl" for="fN">Número</label><input class="field" id="fN" inputmode="numeric" value="${esc(n)}"></div>
      <div><label class="lbl" for="fC">Categoría</label>
      <select class="field" id="fC">${cats.map(k=>`<option value="${k}" ${c?.c===k?"selected":""}>${esc(CATS[k].n)}</option>`).join("")}</select></div>
    </div>
    <label class="lbl">Sugerido para</label>
    <div class="checks">${PARTES.map(p=>`<label><input type="checkbox" value="${p.k}" ${sug.includes(p.k)?"checked":""}> ${esc(p.n)}</label>`).join("")}</div>
    <p class="hint">Si no marcás ninguna, se usan las partes habituales de su categoría.</p>
    <label class="lbl" for="fX">Letra</label>
    <textarea class="field" id="fX" placeholder="1. Primera estrofa…&#10;&#10;Estribillo sin número…&#10;&#10;2. Segunda estrofa…">${esc(c?textoDe(c):"")}</textarea>
    <p class="hint">Separá cada estrofa con una línea en blanco. Las estrofas numeradas (1., 2., …) se muestran como estrofas; lo que va sin número, como estribillo.</p>`,
    `${c?`<button class="btn ghost" data-act="ocultarCanto" data-id="${esc(c.id)}" style="margin-right:auto">Quitar del cantoral</button>`:""}<button class="btn" data-act="cerrar">Cancelar</button><button class="btn primary" data-act="guardarCanto" data-id="${esc(c?.id||"")}">${c?"Guardar cambios":"Agregar al cantoral"}</button>`);
}

async function guardarCanto(id){
  const t=document.getElementById("fT").value.trim();
  const x=document.getElementById("fX").value;
  if(!t||!x.trim()){toast("Falta el título o la letra.");return}
  const data={t, n:+document.getElementById("fN").value||0, c:document.getElementById("fC").value, e:parsearTexto(x)};
  const marcadas=[...$layer.querySelectorAll('.checks input:checked')].map(i=>i.value);
  const nid = id || ("n-"+Date.now().toString(36));
  const def=CATS[data.c]?.p||[];
  const iguales = marcadas.length===0 || (marcadas.length===def.length && marcadas.every(k=>def.includes(k)));
  if(!iguales) data.p=marcadas;
  extra[nid]=data; LS.set("locales",extra); _cache=null;
  cerrarCapa(); render();
  toast(id?"Cambios guardados en este dispositivo.":"Canto agregado en este dispositivo.");
}
function ocultarCanto(id){
  if(!confirm("¿Quitar este canto del cantoral? Los repertorios que ya lo usan lo seguirán mostrando.")) return;
  const c=canto(id); if(!c) return;
  if(!BASE.some(b=>String(b.id)===id)) delete extra[id]; else extra[id]={n:c.n,t:c.t,c:c.c,e:c.e,oculto:true};
  LS.set("locales",extra); _cache=null; cerrarCapa(); render(); toast("Canto quitado del cantoral.");
}
function exportar(){
  const lista=cantos().map(c=>{const o={id:c.id,n:c.n,t:c.t,c:c.c,e:c.e}; if(c.p&&c.p.length) o.p=c.p; return o;});
  const blob=new Blob([JSON.stringify(lista,null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="cantos.json";
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  hoja("Cantoral exportado",`<p>Se descargó el archivo <b>cantos.json</b>. Para que los cambios lleguen a todos, subilo a la página reemplazando el anterior.</p>
    <p class="hint">Cuando la página ya muestre los cambios, este dispositivo deja de marcarlos como pendientes automáticamente.</p>`,
    `<button class="btn primary" data-act="cerrar">Entendido</button>`);
}

function abrirCompartir(){
  const url=repAEnlace(S.rep);
  hoja("Compartir enlace",`
    <p>Quien abra este enlace verá el repertorio en orden, listo para cantar. No necesita cuenta ni instalar nada.</p>
    <textarea class="field linkbox" id="lnk" readonly style="min-height:110px">${esc(url)}</textarea>`,
    `<button class="btn" data-act="cerrar">Cerrar</button>${navigator.share?`<button class="btn" data-act="enviar">Enviar…</button>`:""}<button class="btn primary" data-act="copiar">Copiar enlace</button>`);
}

/* ===================== Modo coro ===================== */
function secuencia(rep){
  const out=[]; if(!rep) return out;
  [...rep.p].sort((a,b)=>(PARTE[a.k]?.i??99)-(PARTE[b.k]?.i??99)).forEach(p=>p.s.forEach((id,si)=>out.push({k:p.k,id,c:canto(id),nota:si===0?p.nota:""})));
  return out;
}
function abrirCoro(rep,i){
  const items=secuencia(rep); if(!items.length) return;
  S._coro={items,i:Math.max(0,Math.min(i,items.length-1)),rep,idx:false}; S._enCoro=true;
  pintarCoro(true);
  document.addEventListener("keydown",teclasCoro);
}
function pintarCoro(scrollTop){
  const {items,i,idx}=S._coro, it=items[i], prev=items[i-1], next=items[i+1];
  $layer.innerHTML=`<div class="coro" role="dialog" aria-modal="true" aria-label="Modo coro">
    <div class="coro-h">
      <button class="iconbtn" data-act="cerrar" aria-label="Salir">✕</button>
      <div class="where"><div class="pp">${esc(PARTE[it.k]?.n||"")}</div><div class="of">${i+1} de ${items.length}${S._coro.rep.t?" · "+esc(S._coro.rep.t):""}</div></div>
      <button class="iconbtn" data-act="lec" data-d="-1" aria-label="Letra más chica">A−</button>
      <button class="iconbtn" data-act="lec" data-d="1" aria-label="Letra más grande">A+</button>
      <button class="iconbtn" data-act="theme" title="Modo claro u oscuro" aria-label="Cambiar a modo claro u oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
      <button class="iconbtn" data-act="indice" aria-label="Índice y opciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
    </div>
    <div class="coro-b" id="coroB">${htmlCanto(it.c,it.nota)}</div>
    <div class="coro-f">
      <button data-act="mover" data-d="-1" ${prev?"":"disabled"}><span class="dir">← Anterior</span><span class="nx">${prev?esc(PARTE[prev.k]?.n+" · "+(prev.c?.t||"")):"—"}</span></button>
      <button data-act="mover" data-d="1" ${next?"":"disabled"}><span class="dir">Siguiente →</span><span class="nx">${next?esc(PARTE[next.k]?.n+" · "+(next.c?.t||"")):"Fin del repertorio"}</span></button>
    </div>
    ${idx?`<div class="pane"><div class="sheet-h"><h3>Orden de la Misa</h3><button class="iconbtn" data-act="indice" aria-label="Cerrar índice">✕</button></div>
      <ol>${items.map((x,j)=>`<li><button data-act="ir" data-i="${j}" aria-current="${j===i}"><span class="p">${esc(PARTE[x.k]?.n)}</span><span class="t">${esc(x.c?(x.c.n+". "+x.c.t):"—")}</span></button></li>`).join("")}</ol>
      <div class="opts">
        <div class="row"><span>Repetir el estribillo tras cada estrofa</span>
          <span class="seg"><button data-act="coroR" data-v="0" aria-pressed="${!S.coroR}">No</button><button data-act="coroR" data-v="1" aria-pressed="${S.coroR}">Sí</button></span></div>
      </div></div>`:""}
  </div>`;
  document.getElementById("coroB").style.setProperty("--lec",S.lec+"rem");
  if(scrollTop) document.getElementById("coroB").scrollTop=0;
  const b=document.getElementById("coroB");
  let x0=null,y0=null;
  b.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  b.addEventListener("touchend",e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
    if(Math.abs(dx)>70 && Math.abs(dy)<60) moverCoro(dx<0?1:-1); },{passive:true});
}
function moverCoro(d){const c=S._coro; const n=c.i+d; if(n<0||n>=c.items.length) return; c.i=n; c.idx=false; pintarCoro(true)}
function teclasCoro(e){ if(!S._enCoro) return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){moverCoro(1);e.preventDefault()}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){moverCoro(-1);e.preventDefault()}
  else if(e.key==="Escape"){cerrarCapa()} }

/* ===================== Eventos ===================== */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, d=el.dataset;
  if(a==="fondo" && e.target!==el) return;
  const r=S.rep;
  switch(a){
    case "tab": S.view=d.v; cerrarCapa(); render(); window.scrollTo(0,0); break;
    case "theme": { const cur=document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
      const nx=cur==="dark"?"light":"dark"; document.documentElement.dataset.theme=nx; LS.set("tema",nx); break; }
    case "fondo": case "cerrar": cerrarCapa(); break;
    case "cat": S.cat=d.c; render(); break;
    case "leer": abrirLectura(d.id); break;
    case "elegir": abrirSelector(+d.pi); break;
    case "agregar": { const p=r.p[S._pi]; if(!p.s.includes(d.id)) p.s.push(d.id); guardarBorrador(); cerrarCapa(); render(); break; }
    case "quitarCanto": r.p[+d.pi].s.splice(+d.si,1); guardarBorrador(); render(); break;
    case "subir": { const s=r.p[+d.pi].s, i=+d.si; [s[i-1],s[i]]=[s[i],s[i-1]]; guardarBorrador(); render(); break; }
    case "quitarParte": r.p.splice(+d.pi,1); guardarBorrador(); render(); break;
    case "vaciar": if(confirm("¿Borrar este repertorio y empezar uno nuevo?")){S.rep=nuevoRep();guardarBorrador();render()} break;
    case "cantar": { const rep = S.mode==="edit" || !S.shared ? S.rep : S.shared; abrirCoro(rep,+d.i||0); break; }
    case "mover": moverCoro(+d.d); break;
    case "ir": S._coro.i=+d.i; S._coro.idx=false; pintarCoro(true); break;
    case "indice": S._coro.idx=!S._coro.idx; pintarCoro(false); break;
    case "lec": S.lec=Math.max(.95,Math.min(2.4,+(S.lec+(+d.d)*.12).toFixed(2))); LS.set("lec",S.lec); document.getElementById("coroB").style.setProperty("--lec",S.lec+"rem"); break;
    case "coroR": S.coroR=d.v==="1"; LS.set("coroR",S.coroR); pintarCoro(false); break;
    case "compartir": abrirCompartir(); break;
    case "copiar": { const t=document.getElementById("lnk"); t.select();
      try{ await navigator.clipboard.writeText(t.value); toast("Enlace copiado."); }
      catch{ try{ document.execCommand("copy"); toast("Enlace copiado."); }catch{ toast("Seleccioná el enlace y copialo manualmente."); } }
      break; }
    case "enviar": {
      // El enlace va dentro del texto: algunas apps (Telegram, WhatsApp) descartan el campo url
      const link=document.getElementById("lnk").value;
      const titulo=S.rep.t||"Repertorio de la Misa";
      const fecha=S.rep.d?fechaLarga(S.rep.d):"";
      const texto=titulo+(fecha?"\n"+fecha.charAt(0).toUpperCase()+fecha.slice(1):"")+"\n\n"+link;
      try{ await navigator.share({text:texto}); }
      catch(err){ if(err && err.name!=="AbortError"){ try{ await navigator.clipboard.writeText(link); toast("No se pudo abrir el menú para compartir. El enlace quedó copiado."); }catch{ toast("No se pudo abrir el menú para compartir. Usá «Copiar enlace»."); } } }
      break; }
    case "modoDir": S.dir=!S.dir; LS.set("director",S.dir); render(); break;
    case "exportar": exportar(); break;
    case "ocultarCanto": ocultarCanto(d.id); break;
    case "editarDesde": { const src=S.shared||vigente; if(src) S.rep=JSON.parse(JSON.stringify({t:src.t,d:src.d,p:src.p})); S.mode="edit"; guardarBorrador(); render(); break; }
    case "salirEdicion": S.mode="read"; render(); break;
    case "nuevoCanto": abrirFormCanto(null); break;
    case "editarCanto": abrirFormCanto(d.id); break;
    case "guardarCanto": guardarCanto(d.id); break;
  }
});
document.addEventListener("keydown",e=>{ const el=e.target.closest?.("li[data-act]"); if(el && (e.key==="Enter"||e.key===" ")){e.preventDefault();el.click()} });
document.addEventListener("input",e=>{
  const el=e.target, k=el.dataset?.in; if(!k) return;
  if(k==="q"){S.q=el.value;S._focusQ=true;renderLib();return}
  if(k==="t"||k==="d"){S.rep[k]=el.value;guardarBorrador();return}
  if(k==="nota"){S.rep.p[+el.dataset.pi].nota=el.value;guardarBorrador();return}
});

/* ===================== Inicio ===================== */
function slugCat(nombre){
  const n=nombre.trim(); if(!n) return "";
  const k=Object.keys(CATS).find(k=>norm(CATS[k].n)===norm(n)||k===n); if(k) return k;
  const slug=norm(n).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
  CATS[slug]={n, p:[]}; return slug;
}
function parteDe(txt){
  const x=norm(txt).trim(); if(!x) return null;
  const p=PARTES.find(p=>norm(p.n)===x||p.k===x) || PARTES.find(p=>norm(p.n).startsWith(x)||x.startsWith(norm(p.n)));
  return p?p.k:null;
}
const CLAVES={numero:"numero",n:"numero",no:"numero",titulo:"titulo",categoria:"categoria",partes:"partes",partessugeridas:"partes",visible:"visible"};
function leerArchivo(nombre,texto){
  const lineas=String(texto||"").replace(/^\uFEFF/,"").replace(/\r\n?/g,"\n").replace(/\u000b/g,"\n").split("\n");
  const datos={}; let i=0;
  while(i<lineas.length && !lineas[i].trim()) i++;
  for(;i<lineas.length;i++){
    const l=lineas[i].trim();
    if(!l){ continue; }
    if(/^[-—–_=\s]+$/.test(l)){ i++; break; }                      // separador (---, —, etc.)
    const m=l.match(/^([^:]{1,25}):\s*(.*)$/);
    const k=m && CLAVES[norm(m[1]).replace(/[^a-z]/g,"")];
    if(!k) break;                                                   // empieza la letra
    datos[k]=m[2].trim();
  }
  return {datos, cuerpo:lineas.slice(i).join("\n").trim()};
}
function desdeArchivos(lista){
  const avisos=[], cantos=[], vistos=new Map();
  lista.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es",{numeric:true}));
  for(const a of lista){
    const ref=`«${a.nombre}»`;
    const {datos,cuerpo}=leerArchivo(a.nombre,a.texto);
    let n=parseInt(datos.numero,10);
    if(isNaN(n)){ const m=a.nombre.match(/^\s*(\d+)/); if(m) n=parseInt(m[1],10); }
    if(isNaN(n)){ avisos.push(`${ref}: falta el número.`); continue; }
    if(vistos.has(n)){ avisos.push(`${ref}: el número ${n} ya lo usa «${vistos.get(n)}».`); continue; }
    const tit=datos.titulo || a.nombre.replace(/^\s*\d+\s*[-–.]?\s*/,"").replace(/\.txt$/i,"").trim();
    if(!tit){ avisos.push(`${ref}: falta el título.`); continue; }
    if(!cuerpo) avisos.push(`${ref}: no tiene letra cargada.`);
    vistos.set(n,a.nombre);
    const c={id:String(n), n, t:tit, c:slugCat(datos.categoria||"")||"sin-categoria", e:parsearTexto(cuerpo)};
    if(c.c==="sin-categoria"&&!CATS["sin-categoria"]) CATS["sin-categoria"]={n:"Sin categoría",p:[]};
    if(!datos.categoria) avisos.push(`${ref}: falta la categoría.`);
    const keys=[]; (datos.partes||"").split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{const k=parteDe(x); if(k) keys.push(k); else avisos.push(`${ref}: no se reconoce la parte «${x}».`)});
    if(keys.length) c.p=keys;
    if(["no","n","0","oculto"].includes(norm(datos.visible||""))) c.oculto=true;
    if(c.e.length && !c.e.some(x=>x[0]==="v") && c.e.length>1) avisos.push(`${ref}: ninguna estrofa tiene número; revisar que no se haya convertido en lista automática.`);
    cantos.push(c);
  }
  return {cantos, avisos};
}
async function cargarCantoral(){
  if(!FUENTE.startsWith("http")) return false;
  try{
    const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),60000);
    const r=await fetch(FUENTE,{cache:"no-store",signal:ctl.signal}); clearTimeout(tm);
    if(!r.ok) return false;
    const data=await r.json();
    const {cantos:lista,avisos}=desdeArchivos(data.archivos||[]);
    AVISOS=[...(data.errores||[]),...avisos];
    if(!lista.length) return false;
    BASE=lista; _cache=null;
    LS.set("cache",{c:lista,a:AVISOS,cats:CATS,t:Date.now()});
    return true;
  }catch{ return false; }
}
function refrescar(){
  _cache=null; render();
  if(S._enCoro && S._coro){ S._coro.items=secuencia(S._coro.rep); pintarCoro(false); }
  if(document.getElementById("picklist")) pintarSelector();
}
(async function(){
  const t=LS.get("tema",null); if(t) document.documentElement.dataset.theme=t;
  try{ localStorage.removeItem("cantoral:locales"); localStorage.removeItem("cantoral:director"); }catch{}
  // 1) La última versión guardada en este dispositivo, para abrir al instante
  const cache=LS.get("cache",null);
  if(cache && Array.isArray(cache.c) && cache.c.length){ Object.assign(CATS,cache.cats||{}); BASE=cache.c; AVISOS=cache.a||[]; }
  const rep=enlaceARep(); if(rep){S.shared=rep;S.mode="read"}
  // 2) La planilla: si no hay nada guardado, se espera; si lo hay, se actualiza después
  render();
  if(rep && secuencia(rep).length) abrirCoro(rep,0);
  if(await cargarCantoral()) refrescar(); else if(AVISOS.length) render();
})();
window.addEventListener("hashchange",()=>{ const rep=enlaceARep(); if(rep){S.shared=rep;S.mode="read";S.view="rep";cerrarCapa();render();abrirCoro(rep,0);} });
</script>
