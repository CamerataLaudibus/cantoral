<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cantoral de la Schola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f6f2; --panel:#ffffff; --ink:#221f2b; --muted:#6c6878; --line:#dedad0;
  --rubric:#a3262a; --rubric-soft:#f3e3e1; --gold:#8f7336; --sel:#ece8de;
  --serif:"Alegreya", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sc:"Alegreya SC", "Alegreya", Georgia, serif;
  --sans:"Alegreya Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --lec:1.3rem;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16151b; --panel:#1f1d25; --ink:#ebe6da; --muted:#9d97a8; --line:#34313d;
    --rubric:#e37c74; --rubric-soft:#3a2426; --gold:#c8a765; --sel:#2a2731;
  }
}
:root[data-theme="dark"]{
  --paper:#16151b; --panel:#1f1d25; --ink:#ebe6da; --muted:#9d97a8; --line:#34313d;
  --rubric:#e37c74; --rubric-soft:#3a2426; --gold:#c8a765; --sel:#2a2731;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--rubric);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 120px}

/* Header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:1.5rem;font-weight:500;letter-spacing:.01em;padding-bottom:10px}
.brand b{color:var(--rubric);font-weight:500}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 14px 11px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--rubric)}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}

/* General */
h2.sec{font-family:var(--serif);font-weight:500;font-size:1.65rem;margin:28px 0 4px}
p.lead{color:var(--muted);margin:0 0 18px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 16px;font-weight:500}
.btn.primary{background:var(--rubric);border-color:var(--rubric);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1a1418}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1a1418}}
.btn.ghost{background:none;border-color:transparent;color:var(--rubric);padding-left:6px;padding-right:6px}
.btn:disabled{opacity:.45;cursor:default}
a.btn{text-decoration:none;display:inline-block}
.field{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
textarea.field{min-height:220px;font-family:var(--serif);font-size:1.05rem;line-height:1.5}
label.lbl{display:block;font-weight:500;margin:14px 0 6px}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
.notice{border-left:3px solid var(--rubric);background:var(--rubric-soft);padding:12px 14px;border-radius:0 10px 10px 0;margin:16px 0}
.notice b{font-weight:700}

/* Repertorio (builder) */
.rep-head{display:grid;gap:10px;margin:22px 0 8px}
.rep-title{font-family:var(--serif);font-size:1.6rem;border:0;border-bottom:1px solid var(--line);background:none;padding:6px 0;width:100%}
.rep-title::placeholder{color:var(--muted);opacity:.7}
.rep-date{border:0;background:none;color:var(--muted);padding:0}
ol.partes{list-style:none;margin:10px 0 0;padding:0;counter-reset:p}
li.parte{position:relative;padding:16px 0 16px 44px;border-bottom:1px solid var(--line)}
li.parte::before{counter-increment:p;content:counter(p);position:absolute;left:0;top:14px;font-family:var(--serif);font-size:1.5rem;color:var(--rubric);width:32px;text-align:right}
.parte-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.parte-n{font-family:var(--sc);font-weight:700;font-size:1.08rem;letter-spacing:.03em}
.parte-tools{display:flex;gap:2px}
.mini{background:none;border:0;color:var(--muted);padding:4px 8px;border-radius:8px;font-size:.92rem}
.mini:hover{background:var(--sel);color:var(--ink)}
.chips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chip{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.chip .num{font-family:var(--serif);color:var(--rubric);min-width:1.8em}
.chip .tt{flex:1;font-family:var(--serif);font-size:1.08rem}
.add-canto{margin-top:8px;background:none;border:1px dashed var(--line);border-radius:10px;width:100%;text-align:left;padding:9px 12px;color:var(--muted)}
.add-canto:hover{border-color:var(--rubric);color:var(--rubric)}
.nota{margin-top:8px;width:100%;border:0;border-bottom:1px dotted var(--line);background:none;padding:4px 0;color:var(--muted);font-style:italic;font-family:var(--serif)}
.actions{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
.actions-in{max-width:760px;margin:0 auto;padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions-in .grow{flex:1}

/* Vista de solo lectura (miembros) */
.hoy{margin-top:26px}
.hoy .fecha{color:var(--muted)}
.hoy h2{font-family:var(--serif);font-weight:500;font-size:2rem;line-height:1.15;margin:4px 0 18px}
ol.orden{list-style:none;padding:0;margin:0}
ol.orden li{display:grid;grid-template-columns:9.5em 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
ol.orden li:hover .t{color:var(--rubric)}
ol.orden .p{font-family:var(--sc);font-weight:500;color:var(--rubric);font-size:.98rem;padding-top:3px}
ol.orden .t{font-family:var(--serif);font-size:1.15rem}
ol.orden .nt{display:block;color:var(--muted);font-style:italic;font-size:.95rem}
@media (max-width:520px){ol.orden li{grid-template-columns:1fr;gap:0}}

/* Cantoral */
.search{position:relative;margin:20px 0 12px}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filtros button{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 13px;font-size:.93rem;color:var(--muted)}
.filtros button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
h3.cat{font-family:var(--sc);font-weight:700;color:var(--rubric);font-size:1.05rem;letter-spacing:.03em;margin:26px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
ul.lista{list-style:none;margin:0;padding:0}
ul.lista li button{display:grid;grid-template-columns:2.6em 1fr auto;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 4px;align-items:baseline}
ul.lista li button:hover{background:var(--sel)}
ul.lista .n{font-family:var(--serif);color:var(--rubric);text-align:right}
ul.lista .t{font-family:var(--serif);font-size:1.1rem}
ul.lista .f{display:block;color:var(--muted);font-size:.9rem;font-family:var(--serif);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
ul.lista .tag{font-size:.8rem;color:var(--gold);white-space:nowrap}
ul.lista .tt-wrap{min-width:0}

/* Hojas (overlays) */
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,24,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:720px){.sheet-bg{align-items:center}}
.sheet{background:var(--paper);width:100%;max-width:720px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .22s ease-out}
@media (min-width:720px){.sheet{border-radius:18px}}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{padding:16px 18px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h3{margin:0;font-family:var(--serif);font-weight:500;font-size:1.35rem}
.sheet-b{overflow:auto;padding:4px 18px 24px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 18px 14px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}

/* Texto del canto */
.canto{font-family:var(--serif);font-size:var(--lec);line-height:1.55}
.canto .enc{display:flex;align-items:flex-start;gap:.5em;margin:.4em 0 1em}
.canto .versal{font-size:2.7em;line-height:.9;color:var(--rubric);font-weight:500;min-width:1.2em}
.canto h1{font-family:var(--serif);font-weight:500;font-size:1.25em;line-height:1.2;margin:.15em 0 0}
.canto .cat{font-size:.62em;color:var(--muted);font-family:var(--sans);margin-top:.35em}
.canto .obs{font-style:italic;color:var(--rubric);font-size:.8em;margin:-.4em 0 1em}
.canto .b{margin:0 0 1em;white-space:pre-line;position:relative}
.canto .b.v{padding-left:1.8em}
.canto .b.v .k{position:absolute;left:0;top:0;color:var(--rubric);font-size:.85em;padding-top:.12em}
.canto .b.r{padding-left:1.8em;font-style:italic}
.canto .b.r .k{position:absolute;left:0;top:0;color:var(--rubric);font-style:normal}
.canto .b.l{font-family:var(--sc);color:var(--gold);font-size:.8em;margin:1.4em 0 .2em;font-weight:500}

/* Modo coro */
.coro{position:fixed;inset:0;z-index:30;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.coro-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.coro-h .where{flex:1;min-width:0}
.coro-h .pp,.coro-h .of{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coro-h .iconbtn{flex:none}
@media (max-width:420px){.coro-h{gap:6px;padding:10px}.coro-h .iconbtn{width:36px;height:36px}}
.coro-h .pp{font-family:var(--sc);font-weight:700;color:var(--rubric);font-size:1.02rem;letter-spacing:.03em}
.coro-h .of{color:var(--muted);font-size:.88rem}
.coro-b{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.coro-b .canto{max-width:720px;margin:0 auto;padding:18px 22px 40px}
.coro-f{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.coro-f button{background:none;border:0;padding:12px 16px;text-align:left;min-height:64px}
.coro-f button + button{border-left:1px solid var(--line);text-align:right}
.coro-f .dir{display:block;color:var(--muted);font-size:.85rem}
.coro-f .nx{display:block;font-family:var(--serif);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coro-f button:disabled{opacity:.35}
.pane{position:absolute;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--panel);border-left:1px solid var(--line);z-index:31;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(20px);opacity:.5}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.pane{animation:none}}
.pane ol{list-style:none;margin:0;padding:6px 0;overflow:auto;flex:1}
.pane li button{width:100%;text-align:left;background:none;border:0;padding:10px 18px;display:block}
.pane li button[aria-current="true"]{background:var(--rubric-soft)}
.pane .p{font-family:var(--sc);color:var(--rubric);font-size:.9rem;display:block}
.pane .t{font-family:var(--serif);font-size:1.05rem}
.opts{padding:12px 18px;border-top:1px solid var(--line);display:grid;gap:10px}
.opts .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* Selector de cantos */
.grp{font-family:var(--sc);font-weight:700;color:var(--rubric);font-size:.98rem;margin:18px 0 2px}
.grp small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:.85rem}
.pick li button .add{color:var(--rubric);font-size:1.3rem;line-height:1}
.pick li.in button{opacity:.5}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;z-index:50;font-size:.95rem;max-width:90vw}
.linkbox{font-family:var(--sans);font-size:.85rem;word-break:break-all}
.empty{padding:28px 0;color:var(--muted);text-align:center}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 12px;margin-top:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:.95rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">Cantoral <b>de la Schola</b></div>
    <div style="display:flex;align-items:center;gap:8px">
      <nav class="tabs" role="tablist">
        <button role="tab" data-act="tab" data-v="rep" id="tab-rep">Repertorio</button>
        <button role="tab" data-act="tab" data-v="lib" id="tab-lib">Cantoral</button>
      </nav>
      <button class="iconbtn" data-act="theme" title="Cambiar claro u oscuro" aria-label="Cambiar claro u oscuro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>
<main class="wrap" id="main"></main>
<div id="bar"></div>
<div id="layer"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== Datos ===================== */
const CANTOS_EMB = [{"id":"1","n":1,"t":"Rey de los reyes","c":"procesionales-y-recesionales","e":[["v",1,"Rey de los reyes, Señor del orbe,\nRey de las mentes y los corazones.\n¡Gloria al Señor!"],["r",0,"¡Ven, Cristo, y reina,\ntuyo es el cielo, tuya la tierra!\nHoy te aclamamos, Rey de los hombres.\n¡Gloria al Señor!"],["v",2,"Rey que en tu muerte nos das la vida,\nRey que en tu triunfo nos das la dicha\n¡Gloria al Señor!"],["v",3,"Rey que nos brindas tu amor divino,\nRey que te entregas en Pan y Vino.\n¡Gloria al Señor!"],["v",4,"Reina en las almas y en los hogares\nde nuestra patria.\n¡Oh Cristo Rey de Amor!\n¡Gloria al Señor!"],["r",0,"¡Ven Cristo y reina,\ntuyo es el cielo, tuya la tierra!\nHoy te aclamamos Rey de los hombres.\n¡Gloria al Señor!"]]},{"id":"2","n":2,"t":"Gloria al Señor","c":"procesionales-y-recesionales","e":[["v",1,"¡Alma, bendice al Señor, Rey potente de gloria!\nÉl es la cumbre y sentido de toda la Historia.\nLos que escucháis, venid con fe hasta el altar,\nA celebrar su victoria."],["v",2,"¡Gloria al Señor, las ofrendas al ara traigamos!\nEn confesión los pecados, contritos, digamos.\nConfiad en Él, también nuestra juventud,\nRenueva con gran fortitud."],["v",3,"¡Gloria al Señor, sus proezas grandiosas cantemos!\nEn la asamblea festiva memoria haremos:\nYa no tardéis, en comunión avanzad,\ny al Dios Trino adorad."],["v",4,"¡Gloria al Señor, veneremos al Rey de los siglos!\nQue nuestro «Amén», en el templo resuene airoso.\nAdoración en el espíritu dad,\nSincero culto en la verdad."],["v",5,"¡Alma, bendice al Señor que selló nuestra Alianza!\nCordero que borra con su Sangre nuestras manchas.\nLa Santa Cruz, de todo bien plenitud,\nGlorioso trono de salud."],["v",6,"¡Alma, bendice al Señor, de tu vida la Fuente!\nÉl te creó, redimió y te sostiene clemente.\n¡Siempre es fiel, el mismo hoy que ayer,\ny lo será para siempre!"],["v",7,"¡Gloria al Señor, al Mesías que al orbe gobierna!\n¡Bendito sea el Padre de aura superna!\nConsolador, inspíranos con tu son:\n¡danos el cántico nuevo!"]]},{"id":"3","n":3,"t":"Con júbilo vayamos","c":"procesionales-y-recesionales","e":[["v",1,"Con júbilo vayamos a la Casa de Dios;\nDe lado quede todo encono y odio.\nVayamos hoy a la luz, al Monte de la Cruz;\nCon cánticos solemnes por nuestra redención."],["v",2,"Ya están pisando los pies tus umbrales de paz,\nJerusalén, fundada según visión veraz:\nArmoniosa tu vista, feliz contemplación,\nPara quien peregrina con puro corazón."],["v",3,"Allá suben las tribus, las tribus del Señor,\nSegún es norma ritual en Israel viador.\nVan para celebrarte, en gloria y esplendor,\n¡Oh Trono de justicia, del rey David loor!"],["v",4,"Por Jerusalén orad, implorando la paz,\nProsperen los que te aman, escogida ciudad.\nVivan seguros en ti los hijos de Isaac,\nY quienes el Mesías de los pueblos llamó."],["v",5,"Ya baja de los cielos preparada al fin,\nLa Esposa ya está limpia, de blanco y de carmín.\nLa Santa Trinidad es Santuario de Jacob,\nTambién de las naciones, la Casa de oración."],["v",6,"Sin tregua, combatiré procurando tu bien;\nElevemos las voces cantando nuestro «Amén»:\nAl Creador excelso, al Hijo redentor,\nigual latría demos al Santificador."]]},{"id":"4","n":4,"t":"Señor, ¿quién podrá?","c":"procesionales-y-recesionales","e":[["v",1,"Señor, ¿quién podrá morar tu Tienda sin igual?\n¿A quién permitirás Tú vivir junto al altar?\nQuien con todos honrado, practica sin doblez,\nel bien y la belleza, y busca la verdad."],["v",2,"El que nunca al vecino el mal infligirá;\nno difama, engreído, ni nunca mentirá.\nA quien condenas Tú, Dios, también desprecia él:\nsu dilección él sólo da a quien teme al Señor."],["v",3,"Quien juramentos hizo y cumple con rigor,\nél bienaventurado será aunque sufra hoy.\nSin usura sus dones, sin dolo su fracción:\ncon todos él comparte lo que Dios le confió."],["v",4,"El que persigue siempre los preceptos con paz\nen la obediencia de fe ése prosperará.\nBendito será de Dios; con Él habitará:\nla mesa del banquete servida, pronta está."],["v",5,"Venid, amigos todos, nos invita el Señor.\nSu Sangre y su Cuerpo da a quien lo quiera amar.\nAl Padre, la alabanza, Al Hijo, gratitud,\ny al Espíritu Santo, la música sin fin."]]},{"id":"5","n":5,"t":"Alzaron los ríos","c":"procesionales-y-recesionales","e":[["r",0,"Alzaron los ríos, oh mi Señor,\nLevantaron los ríos su voz.\nAlzaron el sonido de su fragor.\nAleluia, aleluia."],["v",1,"El Señor reinó, se revistió de gloria;\nse armó de fortaleza, se ciñó de poder.\nAfirmó la tierra, todos sus pilares,\ny no será conmovida."],["v",2,"Impetuosas aguas, el Señor más fuerte,\nmás fuerte que el oleaje clamoroso del mar.\nEs el Señor Dios, que reina en las alturas,\n¡Él es el Rey de los siglos!"],["v",3,"Todo testimonio tuyo, oh Señor mi Dios,\nEs digno de confianza, de respeto y de amor.\nLa santidad embellece tu Casa\na lo largo de los tiempos."],["v",4,"Al Creador Ingénito sea la gloria;\nal Hijo Unigénito el imperio y señorío;\nal Paráclito, Espíritu Santo,\nla misma latría eterna."]]},{"id":"6","n":6,"t":"Pueblo de reyes","c":"procesionales-y-recesionales","e":[["r",0,"Pueblo de reyes, asamblea santa,\npueblo sacerdotal:\npueblo de Dios, bendice a tu Señor."],["v",1,"Te cantamos Jesús, Hijo amado del Padre,\nte alabamos, eterna Palabra salida de Dios.\nTe cantamos Jesús, que naciste de María,\nte alabamos a Ti, nuestro hermano, nuestro Salvador."],["v",2,"Te cantamos a Ti, Esplendor de la gloria,\nte alabamos, Estrella radiante que anuncias el día.\nTe cantamos Jesús, Luz eterna de Dios,\nte alabamos, Antorcha de la Nueva Jerusalén."],["v",3,"Te cantamos, Mesías que anunciaron los profetas,\nte alabamos a Ti, el esperado del pueblo de Israel.\nTe cantamos Mesías esperado por los pobres,\nte alabamos Jesús, nuestro Rey de humilde corazón."],["v",4,"Te cantamos, Mediador entre Dios y los hombres,\nte alabamos, Camino de vida, Puerta del Cielo.\nTe cantamos, Sacerdote de la Nueva Alianza,\nte alabamos, Tú eres nuestra paz por la Sangre de la Cruz."],["v",5,"Te cantamos, Cordero de la Pascua eterna,\nte alabamos, Cordero inmolado por nuestros pecados.\nTe cantamos, Jesús, Templo de la Nueva Alianza,\nte alabamos a Ti, Piedra básica del Templo de Dios."],["v",6,"Te cantamos, Pastor que nos conduces al Reino,\nte alabamos, reúne a tus ovejas en un solo redil.\nTe cantamos, Jesús, Manantial de la gracia,\nte alabamos, oh Fuente de agua viva que apaga nuestra sed."],["v",7,"Te cantamos, oh Cristo, Maná verdadero,\nte alabamos, oh Pan de la vida que el Padre nos da.\nTe cantamos, Imagen del Dios invisible,\nte alabamos, oh Rey de la justicia y Rey de la paz."],["v",8,"Te cantamos, Primicia de aquellos que duermen,\nte alabamos a Ti, el Viviente, Principio y Fin.\nTe cantamos, Jesús, exaltado en la gloria,\nte alabamos a Ti, que vendrás a juzgar la tierra."]]},{"id":"7","n":7,"t":"Hacia ti, morada santa","c":"procesionales-y-recesionales","e":[["r",0,"Hacia ti, morada santa,\nhacia ti, tierra del Salvador,\nperegrinos, caminantes,\nvamos hacia ti."],["v",1,"Venimos a tu mesa,\nsellaremos tu pacto,\ncomeremos tu Carne,\ntu Sangre nos limpiará."],["v",2,"Reinaremos contigo,\nen tu morada santa,\nbeberemos tu Sangre,\ntu fe nos salvará."],["v",3,"Somos tu pueblo santo,\nque hoy camina unido;\nTú vas entre nosotros,\ntu amor nos guiará."],["v",4,"Tú eres el Camino,\nTú eres la esperanza,\nhermano de los pobres. Amen. Aleluia."]]},{"id":"8","n":8,"t":"Cristianos, venid","c":"procesionales-y-recesionales","e":[["r",0,"¡Cristianos venid, cristianos llegad,\nadorad a Cristo, adorad a Cristo,\nque está en el altar!"],["v",1,"Creo en Dios en Dios espero,\namo a Dios mi Redentor,\namo a la Iglesia de Cristo,\nsin la cual no hay salvación."],["v",2,"Son verdades reveladas\nque existe un Dios Creador,\nque la gloria dará al justo\ny el infierno al pecador."],["v",3,"Es un Dios en tres Personas\niguales en perfección,\nPadre, Hijo y Espíritu Santo,\ny no hay más que un solo Dios."],["v",4,"El Hijo quiso ser hombre,\nsin dejar el Ser de Dios,\ny nació de Madre Virgen\npara nuestra redención."],["v",5,"Predicó el Santo Evangelio\ny clavado en cruz murió;\npara salvarnos a todos\nla Santa Iglesia fundó."],["v",6,"La Iglesia, Esposa de Cristo,\nes la fiel congregación\nde todo el pueblo cristiano\ncon el Papa en santa unión."],["v",7,"El Pontífice Romano\nde San Pedro es sucesor,\ninfalible en las verdades\nde la augusta Religión."],["v",8,"Siete son los Sacramentos\nque Jesús instituyó,\ny en ellos nos da la gracia\nque en la Cruz nos mereció."],["v",9,"Si la gracia del Bautismo\nhas perdido, pecador,\npuedes recobrarla haciendo\nuna buena confesión."]]},{"id":"9","n":9,"t":"Pueblo de Dios","c":"procesionales-y-recesionales","e":[["v",1,"Pueblo de Dios,\npueblo elegido y consagrado,\npara cantar las maravillas del Señor.\nGlorifiquemos a nuestro Dios\ny celebremos su gran amor.\n¡Aleluia, aleluia!"],["v",2,"Es el Señor,\nquien nos anuncia su palabra.\nEs el Señor, quien nos invita a la oración."],["v",3,"Es el Señor,\nquien alimenta nuestras vidas.\nEs el Señor, quien se nos da en comunión."]]},{"id":"10","n":10,"t":"Cante la Iglesia","c":"procesionales-y-recesionales","e":[["v",1,"Cante la Iglesia, cante todo el cielo,\ncante la tierra jubilosos salmos,\nhoy Jesucristo, nuestro Rey eterno,\ntriunfa en sus santos."],["v",2,"Ellos marcharon por la dura tierra,\npuestos los ojos fijos en el cielo;\nellos señalan para nuestros pasos,\nlimpio sendero."],["v",3,"Todo lo dieron por amor a Cristo;\nfieles soldados fueron en la vida;\nya coronados, con amor fraterno,\nhoy nos invitan."],["v",4,"Firmes sigamos su segura senda;\nCristo nos llama a su eterna dicha;\nÉl nos espera, en su amor vivamos\ntoda la vida."],["v",5,"Gloria al Padre jubilosos demos\njunto a los santos bienaventurados;\na Jesucristo y al Pneuma Santo\nigual tributo."]]},{"id":"11","n":11,"t":"Jerusalén","c":"procesionales-y-recesionales","e":[["v",1,"Tu Pueblo avanza hacia la luz con esperanza y fortitud:\ndesde Adán hasta José en el Adviento de la fe.\nMuere Abel, y en Babel lenguas dividen a la grey;\ny fue Jerusalén tu elección: gloriosa la ciudad del Rey."],["v",2,"En el Jordán, juras tu amor entre las aguas del perdón:\nmueres a Ti; ¡vives, oh Dios!: el nuevo Adán, el Salvador.\nY en Caná, vino nos das de la unión espiritual\nque en Jerusalén, cumplirás, la humanidad redimirás."],["v",3,"En el Tabor vistes de luz, Hijo de la predilección.\nLa Trinidad muestra su faz como preludio a la Pasión.\nAl tercer día surgirás, Tú, el Viviente, triunfarás,\ny en Jerusalén te verán los elegidos por Yahvé."],["v",5,"Gloria al Padre, Creador, gloria al Hijo, Redentor,\ny al Espíritu Santo, igual tributo de honor.\nCanten los ángeles, loor, con voces poderosas:\ny la Jerusalen celestial alabe siempre a su Dios."]]},{"id":"12","n":12,"t":"Gloria y honor","c":"procesionales-y-recesionales","e":[["v",1,"Gloria y honor a Ti, Señor,\nque nos diste la vida.\nHaz que guardemos fieles,\ntu palabra de verdad."],["v",2,"Tú has venido hoy, Señor,\nen medio de tu pueblo;\nguarda la viña santa:\n¡es la obra de tu bondad!"],["v",3,"Tú eres Gloria de Israel,\nde las naciones Luz sin par;\nTú eres la piedra angular,\npredestinada a triunfar."],["v",4,"Cordero de Dios que en la Cruz\njunto a tu Madre y san Juan\nmueres por darnos el perdón\ny el septiforme Don de Dios."],["v",5,"Tú eres nuestro Buen Pastor,\nque nos llevas contigo;\nTú eres el Camino,\nque conduce a la eternidad."],["v",4,"Verdad que libras a tu grey,\nde toda opresión del mal;\nTú, Fuente de la Vida,\nPromesa de inmortalidad."],["v",5,"Ya no nos llamas siervos,\nRevelación cabal de Dios:\ntodo nos diste a conocer,\namigos fieles haznos hoy."],["v",6,"Gloria al Padre Creador,\ngloria al Hijo Redentor,\ngloria al Espíritu de Amor,\npor siglos sin fin. Amén."]]},{"id":"13","n":13,"t":"Un solo Señor","c":"procesionales-y-recesionales","e":[["r",0,"Un solo señor, una sola fe,\nun solo bautismo,\nun solo Dios y Padre."],["v",1,"Llamados a guardar\nla unidad del Espíritu\npor el vínculo de la paz,\ncantamos y proclamamos:"],["v",2,"Llamados a formar un solo cuerpo\nen un mismo Espíritu,\ncantamos y proclamamos:"],["v",3,"Llamados a compartir\nuna misma esperanza\nen Cristo,\ncantamos y proclamamos:"]]},{"id":"14","n":14,"t":"Mensajero de la paz","c":"procesionales-y-recesionales","e":[["v",1,"El Señor eligió a sus discípulos,\nlos mandó de dos en dos."],["r",0,"Es hermoso ver bajar de la montaña\nlos pies del Mensajero de la paz."],["v",2,"Los mandó a las ciudades\ny lugares donde iba a ir Él."],["v",3,"La cosecha es abundante,\nles dijo el Señor al partir."],["v",4,"Pídanle al Dueño del campo\nque envíe más obreros a la mies."],["v",5,"Al entrar en una casa,\nsaluden anunciando la paz."],["v",6,"Cuando den la paz a los hombres,\nmi paz a todos darán."],["v",7,"El Reino de Dios está cerca,\na todos anunciarán."],["v",8,"Los que a ustedes los reciban,\nme habrán recibido a Mí."],["v",9,"Quien recibe mi palabra,\nrecibe al que me envió."],["v",10,"La alegría del Evangelio,\nnadie les quitará."],["v",11,"Soy Yo quien los ha elegido,\n¡de sus frutos gozarán!"],["v",12,"Gloria al Padre, y al Hijo,\ny al Paráclito también."]]},{"id":"15","n":15,"t":"Envíanos, Padre","c":"procesionales-y-recesionales","e":[["v",1,"Envíanos, Padre, tu Espíritu Santo,\nque nos prometiera tu Hijo, el Señor.\nQue venga a tu Iglesia con sus siete dones\ny nos dé el coraje de vivir tu amor."],["v",2,"Envíanos, Padre, tu Espíritu Santo,\nque nos prometiera tu Hijo, el Señor.\nQue nos dé su ciencia, su sabiduría,\nel entendimiento y el don de oración."],["v",3,"Envíanos, Padre, tu Espíritu Santo,\nque nos prometiera tu Hijo, el Señor.\nNos traiga el consejo, la piedad de hijos,\nnos dé fortaleza y el temor de Dios."],["v",4,"Envíanos, Padre, tu Espíritu Santo,\nque nos prometiera tu Hijo, el Señor.\nSus lenguas de fuego, repártelas, Padre,\ny danos a todos la paz y el amor."],["v",5,"Envíanos, Padre, tu Espíritu Santo,\nque nos prometiera tu Hijo, el Señor.\nTú Espíritu Santo nos llene de gozo,\ny sea en nosotros Palabra de Dios."]]},{"id":"16","n":16,"t":"Te alabamos, Dios","c":"procesionales-y-recesionales","e":[["v",1,"Te alabamos, Dios,\nconfesamos tu Nombre;\na Ti, Padre eternal,\nel orbe te venera.\nCon incesante voz\nte aclama el Serafín,\nel Ángel y el Querub,\nEjércitos sin fin."],["v",2,"Tres veces santo, Dios,\nSeñor del universo.\nTu gloria y majestad,\nllenan cielos y tierra.\nLos santos ensalzan\ntu Nombre sin par\nen coro celestial,\nen mística ciudad."],["v",3,"Dad gracias al Señor,\ncon todas vuestras fuerzas;\ngrandes hazañas dio\na nuestra santa Iglesia.\nNos cuida con amor,\nnos nutre con su pan,\nnos guía con su luz,\nnos cura con su cruz."],["v",4,"Inmensa majestad,\npiadosísimo Padre.\nDigno de adoración,\nel Hijo unigénito.\nFuego sempiterno\ny septiforme Don\nigual adoración\nte rinde la Creación."]]},{"id":"17","n":17,"t":"Alto avanza el blasón","c":"procesionales-y-recesionales","e":[["v",1,"Alto avanza el blasón,\npoderoso estandarte,\nes la Cruz de salvación,\nrefulgente en su misterio:\n¡Hoy la Vida muere allí,\ny en su muerte vida da!"],["v",2,"Sacro altar de inmolación,\nel Cordero en ti se ofrece,\nprecio de la Redención,\nexpiación de nuestras culpas:\n¡Con la lanza que lo hirió\naguas dio de salvación!"],["v",3,"Lo que el Rey David cantó;\nse ha cumplido lo predicho:\nlas naciones ven al Rey,\nen lo alto del madero.\n¡Reina Cristo en la Cruz,\ndesde el árbol reina Dios!"],["v",4,"Árbol bello y fúlgido,\nadornado con su Sangre,\npúrpura sacramental,\nel madero rudo cubre:\n¡Digno fuiste de tocar\nla Ofrenda de la paz!"],["v",5,"Trono es la Cruz real:\nen sus nobles ramas pende\nde la vida inmortal\nel ansiado fruto santo:\n¡Lo que el diablo nos robó\nla obediencia nos ganó!"],["v",6,"¡Salve, Cruz, dignísima,\nesperanza de los hombres!\nEn este día triunfal\nArcoíris de la Alianza:\n¡Da el perdón al pecador,\ny la gracia al que es fiel!"],["v",7,"A la Santa Trinidad\nsea dada la alabanza.\nLos que veneran la Cruz\njubilosos himnos canten:\n¡Fuente de la salvación,\nhaznos hijos de Dios hoy!"]]},{"id":"18","n":18,"t":"Ven, Espíritu Santo","c":"procesionales-y-recesionales","e":[["v",1,"Ven Espíritu Santo\nven a iluminar\nnuestras inteligencias\ny a defendernos del mal"],["v",2,"Tú promesa del Padre\ndon de Cristo Jesús\nven y danos tu fuerza\npara llevar nuestra cruz"],["v",3,"Tú llamado abogado\nnuestro consolador\nven y habita en nosotros\npor la fe y por el amor"],["v",4,"Haz que cada cristiano\nbajo tu inspiración\nsea testigo de Cristo\ncon la palabra y la acción"],["v",5,"Guiados por el Espíritu\nhacia Cristo Jesús,\ncaminemos con júbilo\na la Ciudad de la luz."]]},{"id":"19","n":19,"t":"En medio de los pueblos","c":"procesionales-y-recesionales","e":[["v",1,"En medio de los pueblos,\nColumna de verdad,\nla santa Iglesia se alza\ncual mística Ciudad."],["r",0,"Oh, Cristo, sálvanos,\nSeñor, defiéndenos,\ndevuelve a la humanidad\ntu Paz y la unidad."],["v",2,"Su jefe y rey es Cristo,\nsu Ley la unidad.\nSu Código divino\nla mutua caridad."],["v",3,"La Iglesia es el Misterio\nviviente de Jesús,\nen Ella recibimos\nsu Vida, Fuerza y Luz."],["v",4,"El cielo y la tierra\nen perfecta unidad\npor la gracia divina\nen comunión están."],["v",5,"El Arca del Diluvio\nfue prefiguración:\npara salvarnos todos\nhoy debemos entrar."]]},{"id":"20","n":20,"t":"Oh luz beata","c":"procesionales-y-recesionales","e":[["r",0,"¡Oh, Luz beata de la santa Gloria del Padre celeste!\n¡Inmortal, Santo y Eternal Jesucristo!\n¡Inmortal, Santo y Eternal Jesucristo!"],["v",1,"Al llegar el ocaso del sol,\ncontemplando la luz de la tarde,\ncantamos al Padre, y al Hijo, y al Espíritu de Dios."],["v",2,"Tú eres digno de ser alabado siempre por santas voces,\nHijo de Dios que nos diste la vida, el mundo entero te glorifica."],["v",3,"¡Oh esplendente Luz de Luz! ¡Oh divino Sol de la justicia!\n¡Oh Imagen de la Gloria sublime que llenas la Morada de los cielos!"],["v",4,"Dios que habitas inaccesible luz,\nnos permites presentarnos ante Ti\npara alabarte y ofrecerte el himno vespertino."]]},{"id":"21","n":21,"t":"Puertas, levantad los dinteles","c":"procesionales-y-recesionales","e":[["r",0,"¡Puertas, levantad los dinteles!\n¡Elevaos, portones eternos\ny que pase el Rey de la Gloria! Amén."],["v",1,"Del Señor es la tierra y cuanto hay en ella;\nel mundo y todos sus habitantes.\nÉl la fundó sobre los mares,\nÉl la afirmó sobre los ríos."],["v",2,"¿Y quién es ese Rey de la Gloria?\nEs el Señor, héroe valeroso;\nel Señor poderoso,\npoderoso en la batalla."],["v",3,"¿Quién puede subir al monte del Señor?\n¿Quién permanecerá en el recinto sacro?\nEl de manos inocentes,\nel de puro corazón."],["v",4,"Esta es la generación que te busca,\nque busca tu rostro, Dios de Jacob,\nque recibirá la bendición,\nla recompensa de Dios."]]},{"id":"22","n":22,"t":"Lauda Ierusalem (Sl 147)","c":"procesionales-y-recesionales","e":[["r",0,"Lauda, Jerusalem Dominum: lauda Deum tuum Sion.\nHosanna, hosanna, hosanna Filio David."],["v",1,"Quoniam confortavit seras portarum tuarum:\nbenedixit filiis tuis in te."],["v",2,"Qui posuit fines tuos pacem:\net adipe frumenti satiat te."],["v",3,"Qui emittit eloquium suum terrae:\nvelociter currit sermo ejus."],["v",4,"Qui dat nivem sicut lanam:\nnebulam sicut cinerem spargit."],["v",5,"Mittit crystallum suam sicut buccellas:\nante faciem frigoris ejus quis sustinebit?"],["v",6,"Emittet verbum suum, et liquefaciet ea:\nflabit spiritus ejus, et fluent aquae."],["v",7,"Qui annuntiat verbum suum Jacob:\njustitias et judicia sua Israel."],["v",8,"Non fecit taliter omni nationi:\net judicia sua non manifestavit eis."],["v",9,"Gloria Patri, et Filio, et Spiritui Sancto.\nSicut erat in principio, et nunc, et semper,\net in saecula saeculorum. Amen."]]},{"id":"23","n":23,"t":"O come my friends","c":"procesionales-y-recesionales","e":[["v",1,"«O come my friends 'tis not too late»\njuntos irémos a buscar\nla conversión, renovación,\n«in Christo omnia» fundar."],["v",2,"Nuestro propósito en verdad,\nes retornar a lo fontal:\nal Trono de la gracia ir\n«sacros ausus recludere»:"],["v",3,"Quizás las aguas negarán\nnuestro propósito y sentir;\no bien quizás se nos dará\nabrir las fuentes prístinas."],["v",4,"Mucho perdió nuestra visión\nde aquel tesoro de la fe;\nmas lo que fuimos, somos hoy:\namigos en la Trinidad."],["v",5,"El canto nuevo sonará,\nde los rescoldos surgirá:\nel templo y el hogar serán\naunados en comunidad."],["v",6,"«In caritate fundati»,\nen el amor «radicati»;\nlas fuentes de la vida en Dios\nabiertas en el Ágape."],["v",7,"Con la esperanza hecha luz,\nunidos en diversidad,\n«sacros recludere fontis»:\n«To seek, to find, and not to yield»."]]},{"id":"24","n":24,"t":"Jesús, imagen de Dios Padre","c":"penitenciales","e":[["v",1,"Con corazón contrito y puro,\nTraed, ministros, la oblación,\nQue nuestra santa Madre Iglesia\nAl Padre ofrece como don.\nAlabad al Dios de Jacob,\nBuscad su santo Rostro hoy."],["v",2,"En nuestro altar Él se ofrece,\nCordero reconciliador.\nPor los pecados de los hombres,\nRenueva su consagración.\nAlabad al Dios de Jacob,\nBuscad su santo Rostro hoy."],["v",3,"Jesús, imagen de Dios Padre,\nEl Hijo eterno de su amor;\nSe revistió de nuestra carne\nY compartió nuestro dolor.\nAlabad al Dios de Jacob,\nBuscad su santo Rostro hoy."],["v",4,"Él, que era Todopoderoso,\nCargó con nuestra esclavitud,\nY obedeció hasta la muerte,\nHasta la muerte de la Cruz.\nAlabad al Dios de Jacob,\nBuscad su santo Rostro hoy."],["v",5,"Por eso Dios le ha dado un Nombre\nQue sobre todo nombre está:\nEl más hermoso entre los hombres,\nSeñor del mundo y Salvador.\nAlabad al Dios de Jacob,\nBuscad su santo Rostro hoy."]]},{"id":"25","n":25,"t":"Perdón, oh Dios mío","c":"penitenciales","e":[["r",0,"Perdón, oh Dios mío,\nperdón e indulgencia.\nPerdón y clemencia,\nperdón y piedad."],["v",1,"Pequé, ya mi alma\nsu culpa confiesa:\nmil veces me pesa\nde tanta maldad,\nde tanta maldad."],["v",2,"Mil veces me pesa\nde haber, obstinado,\ntu pecho rasgado\noh, Suma Bondad,\noh, Suma Bondad."],["v",3,"Yo fui quien del duro\nmadero inclemente\nte puso pendiente\ncon vil impiedad,\ncon vil impiedad."],["v",4,"Por mí en el tormento\ntu sangre vertiste\ny prenda me diste\nde amor y humildad,\nde amor y humildad."],["v",5,"Y yo en recompensa,\npecado a pecado,\nla copa he llenado\nde iniquidad,\nde iniquidad."],["v",6,"Hoy vengo contrito,\noh Padre amoroso,\ny pido lloroso\nme tengas piedad,\nme tengas piedad."],["v",7,"Mas ya arrepentido\nte busco lloroso,\noh Padre amoroso,\noh Dios de bondad,\noh Dios de bondad."],["v",8,"Jesús adorable,\nmi culpa olvidad,\nya lloro y prometo\nmi vida enmendar,\nmi vida enmendar."],["v",9,"No peques, cristiano,\nno peques ya más,\ntus culpas confiesa\ncon mucha humildad,\ncon mucha humildad."]]},{"id":"26","n":26,"t":"La carne mortal se calle","c":"penitenciales","e":[["v",1,"La carne mortal se calle\ntemor y temblor guarde;\nnada terrenal medite\ntoda vanidad quite:\ncondenaron hoy a Jesús\nya lo elevan en la cruz."],["v",2,"Los soldados lo azotan\nsurcos de sangre brotan.\nLo coronan con espinas:\nburlas crueles y finas.\nSe mofan de Dios: no saben\ndel Testigo Fiel, el Amén."],["v",3,"Mirad: he aquí al Hombre,\nEmanuel es su nombre:\nacabar con Él reclaman,\n¡crucifícalo!, braman:\ndice ser de Dios el Hijo,\npor nosotros transfijo."],["v",4,"Junto a la cruz en fruto\nsu corazón en luto;\nel dolor la ha traspasado\nel amor la mantiene en pie:\nla Madre de Dios, María,\nesperanza es mía."],["v",5,"Jesucristo Nazareno\ndeclara el madero:\nes el Rey de los judíos,\nmuere por los impíos.\nGlorias sean dadas a Dios\nque en la cruz la vida dio."]]},{"id":"27","n":27,"t":"Oh Víctima inmolada","c":"penitenciales","e":[["v",1,"Oh Víctima inmolada, por nuestra Redención,\nde cuyas llagas brotan, las aguas del perdón.\nCon mis frecuentes culpas mil veces te ofendí,\nperdona mis pecados, y ten piedad de mí."],["v",2,"Oh cuánto amor respira, tu abierto corazón,\ntu muerte fue mi vida, tu cruz mi salvación.\nCon mis frecuentes culpas mil veces te ofendí,\nperdona mis pecados, y ten piedad de mí."],["v",3,"Señor, yo soy tu siervo recíbeme en tu luz\ny del dolor acerbo redímame la Cruz.\nLas sufridas ovejas reclaman al Pastor:\nEscucha Tú sus quejas y calma su dolor."],["v",4,"Oh rostro ensangrentado, imagen del dolor,\nque sufres resignado la burla y el furor;\nsoportas la tortura, la saña, la maldad.\nEn tan cruel amargura ¡cuán grande es tu bondad!"],["v",5,"Oh Padre te pedimos, que quieras aceptar,\nla Hostia pura y santa que está sobre la Cruz;\ny cuantos recibamos el Cuerpo del Señor,\ncolmados nos veamos de gracia y bendición."]]},{"id":"28","n":28,"t":"Victoria, tú reinarás","c":"penitenciales","e":[["r",0,"¡Victoria, Tú reinarás!\n¡Oh Cruz Tú nos salvarás!"],["v",1,"Sobre esta tierra oscura\nderrama tu claridad\noh Cruz, fuente fecunda\nde amor y libertad."],["v",2,"Tus brazos nos reúnan\nen ronda de caridad\ncon todos los hermanos\nque buscan en ti la paz."]]},{"id":"29","n":29,"t":"Nuestra oración","c":"procesion-de-las-ofrendas","e":[["v",1,"Nuestra oración será como el incienso\nque ascenderá hasta tu majestad.\nHumilde pan y vino, este tu pueblo\nte ofrece hoy sobre tu altar de paz.\nJusto es cantar las maravillas todas,\nde un Dios que dio a su Hijo por amor."],["v",2,"Por tu bondad glorificado seas,\nal recibir la ofrenda, que es tu don.\nEsta oblación se hará el Cuerpo y Sangre\nde mi Señor, Misterio en el altar.\nJusto es cantar las maravillas todas,\nde un Dios que dio a su Hijo por amor."],["v",3,"Recibe, oh Dios, el pan de nuestras manos\ncomo expresión de nuestra entrega a Ti.\nPronto se hará tu Cuerpo sacrosanto\nque se inmoló por nuestra Redención.\nJusto es cantar las maravillas todas,\nde un Dios que dio a su Hijo por amor."],["v",4,"Recibe, oh Dios, el vino de este cáliz,\ncomo expresión de nuestra entrega a Ti.\nPronto se hará tu Sangre sacrosanta\nque se inmoló por nuestra Redención.\nJusto es cantar las maravillas todas,\nde un Dios que dio a su Hijo por amor."]]},{"id":"30","n":30,"t":"Ofrenda","c":"procesion-de-las-ofrendas","e":[["v",1,"Al Señor del universo,\nPresentamos nuestra ofrenda\nSon espigas y racimos,\nQue su amor nos regaló."],["v",2,"Será Sangre redentora\nEn el Cáliz consagrado,\nSerá el Cuerpo compartido\nen la santa comunión."],["v",3,"Llene el aire nuestro acento\naclamando al Redentor\nen el santo Sacramento de la gracia y del amor\n(bis)"]]},{"id":"31","n":31,"t":"Padre eterno, Dios","c":"procesion-de-las-ofrendas","e":[["v",1,"Padre eterno, Dios piadoso,\ndígnate aceptar benigno\nesta hostia, trigo nuestro,\ny este cáliz, nuestro vino."],["v",2,"Rebosantes de alegría\na tu altar nos dirigimos,\na ofrecerte nuestros dones\nde tus manos recibidos."],["v",3,"Juntamente te ofrecemos\ncon el pan y con el vino,\ncuanto somos y tenemos\nen un mismo Sacrificio."]]},{"id":"32","n":32,"t":"Oh Santo Espíritu","c":"procesion-de-las-ofrendas","e":[["v",1,"Oh Santo Espíritu\nven de Dios al mundo\na visitar las mentes de tus fieles;\nconcédeles que hoy\nse llenen de tu don:\nlas septiformes dádivas celestes."],["v",2,"Paráclita Virtud,\nexcelsa Luz, Quietud,\nAmor del Padre al Hijo primigénio.\nFuego de caridad,\nFuente viva de paz,\nUnción espiritual del Cristo triunfal."],["v",3,"Oh diestro Índice\ndel soberano Dios;\nPromesa de profetas y el Mesías.\nDador sin par de voz,\npalabra y verdad,\nla ciencia de las lenguas y la piedad."],["v",4,"Aclara con tu luz,\nda fuerzas en la cruz,\na los sentidos y a los corazones.\nRepele con tu ardor\nal enemigo cruel,\ny con tu auxilio une a las facciones."],["v",5,"Danos la vera paz\ndel Resucitado,\nsupera los peligros del camino.\nPor tu intermedio haz\nque conozcamos más\nal Padre y a su Hijo, Jesucristo."],["v",6,"Honor y gloria dad\npor siglos sin final\nal Padre, y con el Padre, al Verbo filial,\ny al Santo Hálito\nque junto y por igual\nde los benditos recibe latría."]]},{"id":"33","n":33,"t":"Soplo de Dios viviente","c":"procesion-de-las-ofrendas","e":[["v",1,"Soplo de Dios viviente,\nque en el principio cubriste el agua,\nsoplo de Dios viviente,\nque fecundaste la creación.\nVen hoy a nuestras almas,\ninfúndenos tus dones,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",2,"Soplo de Dios viviente,\nque vida diste al polvo del suelo;\nsoplo de Dios viviente,\nque insufló Yahvé en Adán.\nVen hoy a nuestras almas,\ninspira nueva vida,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",3,"Soplo de Dios viviente,\nque en el diluvio la paz sellaste,\nsoplo de Dios viviente,\nque renovaste la Creación.\nVen hoy a nuestras almas,\ndanos tus doce frutos,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",4,"Soplo de Dios viviente,\nque en el Mar Rojo sendero abriste,\nsoplo de Dios viviente,\nnube que protegió a Israel.\nVen hoy a nuestras almas,\nrompe nuestras cadenas,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",5,"Soplo de Dios viviente,\nque en dos piedras sellas la Alianza;\nsoplo de Dios viviente,\nque la Ley das en el Sinaí.\nVen hoy a nuestras almas,\nla obediencia suscita,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",6,"Soplo de Dios viviente,\nbajo tu sombra se encarnó el Verbo;\nsoplo de Dios viviente,\nque iluminaste la Creación.\nVen hoy a nuestras almas,\nla Verdad interpreta,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",7,"Soplo de Dios viviente,\nque descendiste sobre el Mesías,\nsoplo de Dios viviente,\nque consagraste al Rey y Pastor.\nVen hoy a nuestras almas,\nmuerte da al hombre viejo,\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"],["v",8,"Soplo de Dios viviente,\nteofanía de fuego y lenguas;\nsoplo de Dios viviente,\nque a la Iglesia insuflas vigor.\nVen hoy a nuestras almas,\nconfirma hoy tu obra;\nsoplo de Dios viviente,\n¡oh Santo Espíritu del Señor!"]]},{"id":"34","n":34,"t":"Padre nuestro, recibid","c":"procesion-de-las-ofrendas","e":[["v",1,"Padre nuestro, recibid\nel humilde don del pan,\nde ese pan que se convertirá\nen el Cuerpo de Jesús."],["v",2,"Recibid también, Señor,\nlos racimos de la vid,\nde la vid que se convertirá\nen la Sangre de Jesús."],["v",3,"Con el vino y con el pan\nofrecemos nuestro don,\nnuestra pobre vida de dolor,\nentregada con amor."],["v",4,"Gloria al Padre y al Amor\ny a Jesús nuestro Señor,\nbendigamos el nombre de Dios\nsiempre y en todo lugar. Amén."]]},{"id":"35","n":35,"t":"Refugio y fortaleza es Dios","c":"procesion-de-las-ofrendas","e":[["v",1,"Refugio y fortaleza es Dios, el todopoderoso;\nayuda siempre próxima en todos los peligros.\nCon su poder vendrá pues Él nos librará,\nnuestro baluarte es Dios, el Santo de Jacob,\ndefensa y buen escudo."],["v",2,"Las aguas alegran, Señor, tu ciudad, Jerusalén,\nel Altísimo consagra su más santa Morada;\nen medio de ella está, nunca vacilará,\nÉl la socorrerá al despuntar el sol,\nsus rivales morirán."],["v",3,"Venid todos a contemplar las maravillas de Dios,\ngrandes hazañas consuma en favor de sus hijos.\nReconoced que Yo, soy el Dios de Israel,\nel arco destrozo, la lanza destruyo,\nel odio extermino."],["v",4,"Gloria sea a la Trinidad, indivisa unidad:\ndad al Padre ingénito alabanza y loor,\nrendid igual honor al Hijo redentor\ny al Consolador, el don Paráclito,\npor siglos sin fin. Amén."]]},{"id":"36","n":36,"t":"Recibe, oh Dios","c":"procesion-de-las-ofrendas","e":[["v",1,"Recibe, oh Dios, el pan que te ofrecemos\nluego será el cuerpo de Jesús.\nTambién acepta nuestro sacrificio\nnuestra oración y nuestro corazón."],["v",2,"Recibe, oh Dios, el vino que ofrecemos\nluego será la sangre de Jesús.\nTambién acepta nuestro sacrificio\nnuestra oración y nuestro corazón."],["v",3,"Recíbelos, Señor, por nuestras faltas\npor los que están aquí junto al altar\npor los cristianos vivos y difuntos\npor todo el mundo por su salvación."]]},{"id":"37","n":37,"t":"Recibe, oh Padre Santo","c":"procesion-de-las-ofrendas","e":[["v",1,"Recibe, oh Padre Santo,\nesta Hostia inmaculado,\nque indignos te ofrecemos\npor nuestros pecados\ny por la salud del mundo."],["r",0,"Ven eterno santificador\ny bendice este sacrificio."],["v",2,"Recibe, oh Padre Santo,\neste cáliz inmaculado,\nque indignos te ofrecemos\npor nuestros pecados\ny por la salud del mundo."]]},{"id":"38","n":38,"t":"Recibe, oh Dios eterno","c":"procesion-de-las-ofrendas","e":[["v",1,"Recibe, oh Dios eterno, la hostia inmaculada\nque luego a Ti inmolada va a ser en el altar.\nCon ella te pedimos que aceptes nuestros dones:\nson fieles corazones que a Ti sólo han de amar."],["v",2,"Oh Dios que reformaste la humanidad caída,\nconfunde nuestra vida con tu divinidad,\nlo mismo que se mezcla en esta ofrenda pura\nel agua es la figura de nuestra humanidad."],["v",3,"El vino de la uva y el trigo en blanco grano\nson fruto de las manos, son hijos del dolor;\nesfuerzos y trabajos que en Cristo se agigantan,\ny por su medio alcanzan valor de redención."]]},{"id":"39","n":39,"t":"Te ofrecemos, oh Señor","c":"procesion-de-las-ofrendas","e":[["v",1,"Te ofrecemos, oh Señor,\neste pan y este vino.\nRecíbelos, es nuestro don,\nrecíbelos de nuestras manos, Señor."],["v",2,"Es trigo de nuestros campos,\nracimo de nuestras viñas.\nEste pan será tu Cuerpo,\ny este vino, tu Sangre."],["v",3,"Te ofrecemos, oh, Señor,\nel trabajo de este día,\nnuestra inquietud, nuestra oración,\nnuestro dolor y alegría, Señor."]]},{"id":"40","n":40,"t":"Cuerpo y Sangre de Jesús","c":"procesion-de-la-comunion-y-eucaristia","e":[["r",0,"Cuerpo y Sangre de Jesús,\npan de vida,\ncáliz del Señor\nen la Eucaristía."],["v",1,"Redimidos por su amor,\nbautizados en su muerte,\nrenovemos las promesas,\nantes de comer su Cuerpo y su Sangre."],["v",2,"El Espíritu de Dios\nconfirmó nuestro Bautismo,\ny hoy imprime en nuestras almas\nel sello de unión en la Eucaristía."],["v",3,"Por la Carne de Jesús,\nDios nos hace de su Raza,\ny en el Pueblo de elegidos\nsomos parte fiel de su Sacerdocio."],["v",4,"Como granos de la vid,\ncomo granos en la espiga,\nun Cuerpo todos formamos,\nen la gran unión del amor cristiano."],["v",5,"Esta mesa fraternal,\nque nos nutre en el destierro,\nes figura del banquete\nque nos reunirá con Cristo en el Cielo."]]},{"id":"41","n":41,"t":"Cantemos al amor de los amores","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Cantemos al Amor de los amores,\ncantemos al Señor.\nDios está aquí,\nvenid adoradores,\nadoremos a Cristo Redentor."],["r",0,"Gloria a Cristo Jesús, cielos y tierra\nbendecid al Señor:\nhonor y gloria a Ti, Rey de la gloria;\namor por siempre a Ti, Dios del Amor."],["v",2,"Unamos nuestra voz a los cantares\ndel coro celestial;\nDios está aquí,\nal Dios de los altares\nalabemos con gozo angelical."],["v",3,"Los que buscáis solaz en vuestras penas\ny alivio en el dolor;\nDios está aquí,\ny vierte a manos llenas\nlos tesoros de divinal dulzor."],["v",4,"¡Oh rara caridad y real fineza,\noh dulce memorial!\nDios está aquí\ncon toda su riqueza,\ncon su Cuerpo y su Sangre divinal."],["v",5,"Que abrace nuestro ser la viva llama\ndel más ferviente amor;\nDios está aquí,\nestá porque nos ama\ncomo padre, amigo y bienhechor."],["v",6,"Cantemos al Amor de los amores,\ncantemos sin cesar;\nDios está aquí,\nvenid adoradores,\nadoremos a Cristo en el altar."]]},{"id":"42","n":42,"t":"Sumo y eterno sacerdote","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Sumo y eterno Sacerdote fiel,\nSeñor Altísimo, Hijo de Dios,\nDanos la firme confesión de fe\nQue a todos gana el Reino de paz."],["v",2,"En la Cruz santa, la vida inmortal\nCual fruto ansiado nos vienes a dar\nTe compadeces de nuestro dolor;\nAtribulado, pero sin pecar."],["v",3,"De Dios Cordero, Supremo Pastor,\nSacerdote según Melquisedec,\nEn los altares, supiste aunar\nAl que ofrece, con el don que das."],["v",4,"Comparezcamos, confiados al fin,\nAnte el trono de gracia y salvación:\nMisericordia y el favor de Dios\nencontraremos, junto a su amor."],["v",5,"Entre los hombres, en el culto a Dios,\nFuiste elegido como Mediador:\nHas ofrecido dones y oblación\nPor amor nuestro, ¡demos gracias a Dios!"],["v",6,"Cristo del Padre la voz escuchó:\nEres mi Hijo, Yo te engendré hoy,\nY en María, Yo te consagré:\nPredestinado como Salvador."],["v",7,"Siervo sufriente, Redentor de Adán,\nPríncipe fuerte, reinas en la Cruz:\nÁrbol de Vida, maná celestial,\nSacro banquete, que sirve Yahvé."],["v",8,"Cuando comemos tu Cuerpo en manjar,\nCuando bebemos del cáliz de paz,\nLa Iglesia toda proclama tu don:\nTu Sacrificio; tu Resurrección."],["v",9,"Señor glorioso, vencedor sin par,\nVela tu Pueblo, espera tu luz,\nHasta que vuelvas, ¡ven, Señor, Jesús!\nTu Esposa es pronta, ya no tardes más."],["v",10,"Gloria sea dada a la Trinidad\nUn solo Dios de igual dignidad;\nA las tres Personas cantemos loor\nunidos todos en el Pueblo de Dios."]]},{"id":"43","n":43,"t":"Vayamos a la mesa","c":"procesion-de-la-comunion-y-eucaristia","e":[["r",0,"Vayamos a la Mesa del Padre celestial\nque allí Jesús ofrece el Pan de eternidad."],["v",1,"Señor, hoy tu visita queremos recibir,\ny renovar las vidas uniéndonos a ti."],["v",2,"Tú vienes a nosotros, amigo de verdad,\nque nada nos separe, Señor de tu amistad."],["v",3,"Tú solo eres camino que nos conduce a Dios,\nrevélanos al Padre y muéstranos su amor."],["v",4,"La Santa Eucaristía renueva tu Pasión,\npor ella nuestra vida se asocia a tu dolor."],["v",5,"Señor, hoy nos congrega la Mesa de tu Altar,\nnos una para siempre la gloria celestial."]]},{"id":"44","n":44,"t":"Bendigamos al Señor","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Bendigamos al Señor\nque nos une en caridad\ny nos nutre con su amor\nen el pan de la unidad.\n¡Oh, Padre Nuestro!"],["v",2,"Conservemos la unidad\nque el maestro nos mandó\ndonde hay guerra que haya paz,\ndonde hay odio que haya amor\n¡Oh, Padre nuestro!"],["v",3,"El Señor nos ordenó\ndevolver el bien por mal,\nser testigos de su amor\ny consuelo fraternal,\n¡Oh, Padre nuestro!"],["v",4,"Al que vive en el dolor\ny al que sufre en soledad\nentreguemos nuestro amor\ny consuelo fraternal\n¡Oh, Padre nuestro!"],["v",5,"El Señor que nos llamó\na vivir en la unidad\nnos congregue con su amor\nen feliz eternidad\n¡Oh, Padre nuestro!"]]},{"id":"45","n":45,"t":"En la fracción del pan","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"En la fracción del pan nos das, Señor, tu salvación:\nNos das tu vida, Cuerpo y Sangre, fruto de tu amor."],["v",2,"Jesús tomando el pan nos dio su Cuerpo en manjar:\nSu Cuerpo, entregado por nosotros en la Cruz."],["v",3,"Tomando el cáliz nos lo dio: «Bebed todos de él»;\nMi Sangre derramada para vuestra redención."],["v",4,"Los desvalidos comerán y el hambre saciarán;\nAlaben al Señor los que lo buscan en la fe."],["v",5,"Yo no he venido a condenar: Yo vine a salvar.\nEl Padre me ha enviado para que encontréis la paz."],["v",6,"Yo soy el pan de vida, el que crea vivirá;\nY Yo le resucitaré para la eternidad."],["v",7,"Partimos este mismo pan, unidos en la fe,\nFormando el Cuerpo del Señor, la Iglesia universal."]]},{"id":"46","n":46,"t":"Alabado sea el Santísimo","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Alabado sea el Santísimo\nSacramento del altar\ny la Virgen concebida\nsin pecado original. (bis)"],["v",2,"Celebremos con fe viva\neste Pan angelical\ny la Virgen concebida\nsin pecado original. (bis)"],["v",3,"Es el Dios que da la vida,\ny nació en un portal,\nde la Virgen concebida\nsin pecado original. (bis)"],["v",4,"El manjar más regalado\nde este suelo terrenal\nes Jesús Sacramentado,\nDios eterno e inmortal. (bis)"]]},{"id":"47","n":47,"t":"Alma de Cristo","c":"procesion-de-la-comunion-y-eucaristia","e":[["r",0,"Alma de Cristo, santifícame.\nCuerpo de Cristo, sálvame.\nSangre de Cristo, embriágame.\nAgua del costado de Cristo, lávame.\nPasión de Cristo, confórtame.\n¡Oh, buen Jesús!, óyeme.\nDentro de tus llagas, escóndeme.\nNo permitas que me aparte de Ti.\nDel enemigo, defiéndeme.\nEn mi muerte, llámame.\nY mándame ir a Ti.\nPara que con tus santos te alabe.\nPor los siglos de los siglos. Amén."]]},{"id":"48","n":48,"t":"Como el ciervo","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Como el ciervo anhela el agua viva te busco Dios;\n¡oh limpio manantial!\nLejos de Ti, Señor, mi sed se aviva\nde ver por fin tu gloria y tu esplendor."],["v",2,"Gozo los bienes que tu amor nos brinda,\nmas sólo a ti, te quiero de verdad.\nTú, sólo Tú, ¡inmensa recompensa!\nDespiertas más mi sed que cualquier bien"],["v",3,"Nos das, Señor, tu gracia en esta vida,\ny al viador lo quieres refrescar.\nPero la sed de contemplar tu rostro\naumenta más, cuánto más cerca estás."],["v",4,"Cuando el dolor quebranta mi energía\ntu Nombre es luz, apoyo y dirección.\nHuye el temor y surge la esperanza;\nyendo a tu luz la noche dejo atrás."]]},{"id":"49","n":49,"t":"Ave verum","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Ave verum Corpus,\nnatum de Maria Virgine,\nvere passum, immolatum\nin cruce pro homine."],["v",2,"Cuius latus perforatum\nluxit aqua et sanguine:\nEsto nobis praegustatum\nmortis in examine."],["r",0,"O Iesu dulcis, O Iesu pie,\nO Iesu, fili Mariae."]]},{"id":"50","n":50,"t":"Es mi Padre","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Es mi Padre quien les da\nverdadero Pan del cielo,\nel que coma de este Pan,\nvivirá eternamente.\nYo soy ese Pan de Vida\nque ha bajado desde el cielo."],["r",0,"Creemos, Señor, en tu palabra:\nTú eres el Pan que da la Vida"],["v",2,"Todo aquel que venga a mí\nno padecerá más hambre,\ntodo aquel que crea en mí\nno padecerá más sed:\nes mi carne la comida\ny es mi Sangre la bebida."],["v",3,"El que come de este Pan\nvive en mí y Yo en él,\nel que bebe de esta copa\ntiene ya la Vida eterna:\nYo lo resucitaré\nen el día del Señor."]]},{"id":"51","n":51,"t":"En la postrera cena","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"En la postrera Cena,\nantes de su Pasión\ndijo el Señor las frases\nde la Consagración"],["v",2,"Tomad, este es Mi Cuerpo\nesta Mi Sangre es\nque por el mundo entrego,\nMisterio de la Fe."],["v",3,"Después hacia el Calvario\npara morir marchó\ny en una Cruz clavado\nSu Sangre derramó."],["v",4,"Católicos hermanos\nsedientos de Su amor\nen Su memoria hagamos\nlo que Él nos ordenó."],["v",5,"Comamos de Su Carne\nque es Pan de Eternidad,\nbebamos de Su Sangre\nla Vida Celestial."]]},{"id":"52","n":52,"t":"Adoro te devote","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Adoro te devote, latens Deitas,\nQuae sub his figuris vere latitas:\nTibi se cor meum totum subiicit,\nQuia te contemplans totum deficit."],["v",2,"Visus, tactus, gustus in te fallitur,\nSed auditu solo tuto creditur.\nCredo quidquid dixit Dei Filius:\nNil hoc verbo Veritatis verius."],["v",3,"In cruce latebat sola Deitas,\nAt hic latet simul et humanitas;\nAmbo tamen credens atque confitens,\nPeto quod petivit latro paenitens."],["v",4,"Plagas, sicut Thomas, non intueor;\nDeum tamen meum te confiteor.\nFac me tibi semper magis credere,\nIn te spem habere, te diligere."],["v",5,"O memoriale mortis Domini!\nPanis vivus, vitam praestans homini!\nPraesta meae menti de te vivere\nEt te illi semper dulce sapere."],["v",6,"Pie pellicane, Iesu Domine,\nMe immundum munda tuo sanguine.\nCuius una stilla salvum facere\nTotum mundum quit ab omni scelere."],["v",7,"Iesu, quem velatum nunc aspicio,\nOro fiat illud quod tam sitio;\nUt te revelata cernens facie,\nVisu sim beatus tuae gloriae.\nAmen"]]},{"id":"53","n":53,"t":"Vayamos a la mesa","c":"procesion-de-la-comunion-y-eucaristia","e":[["r",0,"Vayamos a la Mesa del Padre celestial\nque allí Jesús ofrece el Pan de eternidad."],["v",1,"Señor, hoy tu visita queremos recibir,\ny renovar las vidas uniéndonos a ti."],["v",2,"Tú vienes a nosotros, amigo de verdad,\nque nada nos separe, Señor de tu amistad."],["v",3,"Tú solo eres camino que nos conduce a Dios,\nrevélanos al Padre y muéstranos su amor."],["v",4,"La Santa Eucaristía renueva tu Pasión,\npor ella nuestra vida se asocia a tu dolor."],["v",5,"Señor, hoy nos congrega la Mesa de tu Altar,\nnos una para siempre la gloria celestial."]]},{"id":"54","n":54,"t":"Adoremus in aeternum","c":"procesion-de-la-comunion-y-eucaristia","e":[["r",0,"Adoremus in aeternum Sanctissimum Sacramentum.\nLaudate Dominum Omnes Gentes\nLaudate Eum Omnes Populi\nQuoniam confirmata est super nos misericordia eius\nEt veritas Domini manet in aeternum.\nGloria Patri Et Filio et Spiritui Sancto\nSicut erat in Principio et Nunc et Semper\net in saecula saeculorum. Amen."]]},{"id":"55","n":55,"t":"¡Oh, buen Jesús!","c":"procesion-de-la-comunion-y-eucaristia","e":[["l",0,"Acto de fe"],["v",1,"¡Oh, buen Jesús! Yo creo firmemente\nque por mi bien estás en el altar,\nque das tu cuerpo y sangre juntamente\nal alma fiel en celestial manjar,\nal alma fiel en celestial manjar."],["l",0,"Acto de humildad"],["v",2,"Indigno soy, confieso avergonzado,\nde recibir la santa Comunión;\nJesús que ves mi nada y mi pecado,\nprepara Tú mi pobre corazón,\nprepara Tú mi pobre corazón."],["l",0,"Acto de dolor"],["v",3,"Pequé Señor, ingrato te he ofendido;\ninfiel te fui, confieso mi maldad;\nme pesa ya; perdón, Señor, te pido,\neres mi Dios, apelo a tu bondad,\neres mi Dios apelo a tu bondad."],["l",0,"Acto de esperanza"],["v",4,"Espero en Ti, piadoso Jesús mío;\noigo tu voz que dice «ven a mí»,\nporque eres fiel, por eso en Ti confío;\ntodo Señor, espérolo de Ti,\ntodo Señor, espérolo de ti."],["l",0,"Acto de amor"],["v",5,"¡Oh, buen pastor, amable y fino amante!\nMi corazón se abraza en santo ardor;\nsi te olvidé, hoy juro que constante\nhe de vivir tan sólo de tu amor,\nhe de vivir tan sólo de tu amor."],["l",0,"Acto de deseo"],["v",6,"Dulce maná y celestial comida,\ngozo y salud de quien te come bien;\nven sin tardar, mi Dios, mi luz, mi vida,\ndesciende a mí, hasta mi pecho ven,\ndesciende a mí, hasta mi pecho ven."]]},{"id":"56","n":56,"t":"Sacris solemnes","c":"procesion-de-la-comunion-y-eucaristia","e":[["v",1,"Sacris solemniis juncta sint gaudia,\nEt ex praecordiis sonent praeconia:\nRecedant vetera, nova sint omnia,\nCorda, voces et opera."],["v",2,"Noctis recolitur coena novissima,\nQua Christus creditur agnum et azyma\nDedisse fratribus, juxta legitima\nPriscis indulta patribus."],["v",3,"Post agnum typicum, expletis epulis,\nCorpus Dominicum datum discipulis,\nSic totum omnibus, quod totum singulis,\nEjus fatemur manibus."],["v",4,"Dedit fragilibus corporis ferculum,\nDedit et tristibus sanguinis poculum,\nDicens: Accipite quod trado vasculum,\nOmnes ex eo bibite."],["v",5,"Sic sacrificium istud instituit,\nCujus officium committi voluit\nSolis presbyteris, quibus sic congruit,\nUt sumant, et dent ceteris."],["v",6,"Panis angelicus fit panis hominum:\nDat panis caelicus figuris terminum:\nO res mirabilis! Manducat Dominum\nPauper, servus, et humilis."],["v",7,"Te trina Deitas unaque poscimus,\nSic nos tu visita, sicut te colimus:\nPer tuas semitas duc nos quo tendimus,\nAd lucem quam inhabitas.\nAmen."]]},{"id":"57","n":57,"t":"El ángel vino de los cielos","c":"maria-santisima","e":[["v",1,"El ángel vino de los cielos\ny a María Fiel anunció\nel gran misterio de Dios hombre,\nque a los cielos admiró."],["v",2,"Virgen madre, Señora nuestra,\nrecordando la Encarnación\nte cantamos tus hijos todos,\ncomo estrella de salvación."],["v",3,"«Yo soy la esclava del Señor, mi Dios»,\nla Virgen dijo al contestar,\n«Que se haga en mí según has dicho,\nse cumpla en mí su voluntad»."],["v",4,"Y el Verbo, para redimirnos,\ntomó su carne virginal,\nvivió hecho hombre entre nosotros,\nlibrándonos de eterno mal."]]},{"id":"58","n":58,"t":"Salve, oh Madre","c":"maria-santisima","e":[["v",1,"Salve, oh Madre Corredentora,\nAl pie de la Cruz siempre fiel estás;\nTu corazón por siete espadas sangra\nSegún anuncio de San Simeón."],["v",2,"Tú de Jesús ya en la Cruz reinando,\nEntre dolores por la Redención,\nRecibes a san Juan como a tu hijo\nY a todos los pecadores con él."],["v",3,"Es la generación de los que buscan\nEl rostro augusto del Dios de Jacob:\nEs tu simiente, Madre de los vivos,\nLos que acogieron al Verbo en la fe."],["v",4,"Tú en las Bodas de Caná impetraste\nQue el agua en vino trocara el Señor:\nA tu oración el Cristo anticipa\nEl sufrimiento nupcial de la Cruz."],["v",5,"Cincuenta días después de la Pascua\nPreparas a la Iglesia en oración\nCuando desciende el Espíritu Santo\nLenguas de fuego en Jerusalén."],["v",6,"Oh hija de Sión, cual nueva Eva\nErguida estás a la diestra del Rey,\nEmbellecida toda en oro fino,\nDe Ofir regalo a la Madre de Dios."],["v",7,"A cambio de tus padres tendrás hijos,\nPríncipes son en el Reino de Dios,\nLos diste a luz huyendo al desierto:\nEl águila a la serpiente venció."],["v",8,"El Rey prendado está de tu hermosura,\nSon tus dolores cual zafiro azul;\nTrono de gracia y de misericordia,\nLa nueva Arca de Alianza con Dios."],["v",9,"Gloria al Padre del que eres Hija,\nGloria al Niño de quien eres Madre,\nGloria al Espíritu que te hizo Esposa\npara engendrar a los hijos de Dios."]]},{"id":"59","n":59,"t":"Canta mi alma","c":"maria-santisima","e":[["v",1,"Canta mi alma tu grandeza, Dios, de los pobres Redentor.\nTodo mi ser te reconoce, siempre bendeciré tu amor.\nTodos andábamos errantes, ovejas sin oír tu voz.\nHas pronunciado nuestro nombre y nos conduces, Buen Pastor."],["v",2,"Cada mañana tu palabra alegra nuestro despertar,\nlas creaturas se revisten de tu sencilla claridad.\nSon tus palabras un tesoro que sabe dulce al paladar.\nEl pueblo sabio que te escucha sigue tus sendas al andar."],["v",3,"Siembras la paz entre tus hijos, los unes en un mismo amor.\nEllos comparten como hermanos las alegrías y el dolor.\nQuien sea grande entre vosotros se haga vuestro servidor.\nYo estoy aquí como el que sirve, vais todos en mi corazón."],["v",4,"Ángeles mandas que me guían y, libre, puedo caminar.\nHas perdonado mis pecados: ¡qué grande ha sido tu bondad!\nHa renacido la alegría; el pueblo entona su cantar:\nnuestro banquete prefigura el gozo de la eternidad."]]},{"id":"60","n":60,"t":"Cantad a María","c":"maria-santisima","e":[["v",1,"Cantad a María, la reina del Cielo,\ndel hombre consuelo, de Dios alegría."],["r",0,"Cantad, cantad, cantad a María"],["v",2,"Cantad a María, la Virgen sin mancha,\nla llena de Gracia, por Dios elegida."],["v",3,"Cantad a María, la estrella del alba\nque anuncia a las almas el sol de alegría."],["v",4,"Cantad a María, que dio de su carne\nel cuerpo y la sangre al Verbo de Vida."]]},{"id":"61","n":61,"t":"Oh Santíssima","c":"maria-santisima","e":[["v",1,"Oh Santísima, oh Purísima,\ndulce Virgen María\nMadre amada, inmaculada,\nora, ora por nosotros."],["v",2,"Salve límpida rosa mística,\ndulce Madre del Redentor.\nLlena de gracia, nuestra esperanza,\nora, ora por nosotros."],["v",3,"Los arcángeles y los ángeles,\nDios te salve te cantan.\nTambién los hombres cantan tu nombre\nOra, ora por nosotros."]]},{"id":"62","n":62,"t":"Es tu pueblo","c":"maria-santisima","e":[["v",1,"Es tu pueblo, Virgen pura\ny te da su amor y fe,\ndale tu paz y ventura\nen tu edén de Caacupé (bis)"],["v",2,"Todo el pueblo paraguayo,\nque juró su libertad\na la luz del sol de Mayo,\nhoy aclama tu beldad. (bis)"],["v",3,"Virgen pura tan querida,\nbella flor de Caacupé,\ndanos fuerza, danos vida,\nmás virtudes y más fe. (bis)"],["v",4,"Es tu pueblo que en la guerra\ny en la paz siempre te amó,\nque ha cruzado la alta sierra\ny de hinojos aquí llegó. (bis)"],["v",5,"Ha venido a saludarte\ny a implorar de tu bondad,\nque bendigas su estandarte\ny remedies su ansiedad. (bis)"],["v",6,"Da pureza a nuestra alma\ny energía al corazón,\na la Patria da la calma\ny alta gloria a su pendón. (bis)"]]},{"id":"63","n":63,"t":"Humilde Nazarena","c":"maria-santisima","e":[["v",1,"Humilde nazarena, ¡Oh, María!\nBlancura de azucena, ¡Oh, María!\nSalve, Madre virginal.\nSalve, Rei const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
function fechaLarga(iso){
  if(!iso) return "";
  const [y,m,d]=iso.split("-").map(Number);
  try{return new Date(y,m-1,d).toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch{return iso}
}

function todos(){
  const m = new Map(BASE.map(c=>[String(c.id),{...c,id:String(c.id)}]));
  for(const [id,c] of Object.entries(linkSongs)){ if(c && c.t && !m.has(id)) m.set(id,{...c,id}); }
  for(const [id,c] of Object.entries(extra)){ if(c && c.t) m.set(id,{...c,id}); }
  return [...m.values()].filter(c=>!c.oculto).sort((a,b)=>(a.n||999)-(b.n||999) || a.t.localeCompare(b.t));
}
let _cache=null; function cantos(){return _cache||(_cache=todos())}
function canto(id){id=String(id);return cantos().find(c=>c.id===id) || (extra[id]&&{...extra[id],id}) || BASE.find(c=>String(c.id)===id)}
function sugeridas(c){return (c.p&&c.p.length)?c.p:((CATS[c.c]?.p)||[])}
function catNombre(k){return CATS[k]?.n || k || "Sin categoría"}
function primerVerso(c){const e=(c.e||[]).find(x=>x[0]!=="l");return e?e[2].split("\n")[0]:""}
function busca(c,q){if(!q) return true;const h=norm(c.t+" "+c.n+" "+(c.e||[]).map(e=>e[2]).join(" "));return norm(q).split(/\s+/).every(w=>h.includes(w))}

/* Texto pegado → estrofas (misma regla que la importación de los Word) */
function parsearTexto(txt){
  const bloques = txt.replace(/\r/g,"").split(/\n\s*\n/).map(b=>b.trim()).filter(Boolean);
  const out=[];
  for(const b of bloques){
    if(/^am[eé]n[.!]?$/i.test(b) && out.length){ out[out.length-1][2]+="\n"+b; continue; }
    const m=b.match(/^(\d+)\.\s+/);
    if(m){out.push(["v",+m[1],b.slice(m[0].length)]);continue}
    const ls=b.split("\n");
    if(ls.length>1 && /^\d+\.\s+/.test(ls[1]) && ls[0].length<40){
      out.push(["l",0,ls[0]]); const r=ls.slice(1).join("\n"); const m2=r.match(/^(\d+)\.\s+/);
      out.push(["v",+m2[1],r.slice(m2[0].length)]);
    } else out.push(["r",0,b]);
  }
  return out;
}
function textoDe(c){return (c.e||[]).map(e=>e[0]==="v"?`${e[1]}. ${e[2]}`:e[2]).join("\n\n")}

/* Codificación del repertorio en el enlace */
function b64u(str){const bytes=new TextEncoder().encode(str);let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64u(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function repAEnlace(rep){
  const c={t:rep.t,d:rep.d,p:rep.p.filter(p=>p.s.length||p.nota).map(p=>p.nota?[p.k,p.s,p.nota]:[p.k,p.s])};
  const ids=new Set(rep.p.flatMap(p=>p.s));
  const x=[...ids].filter(id=>extra[id]||linkSongs[id]).map(id=>{const k=canto(id);return k&&{id:k.id,n:k.n,t:k.t,c:k.c,e:k.e}}).filter(Boolean);
  if(x.length) c.x=x;
  return location.href.split("#")[0]+"#r="+b64u(JSON.stringify(c));
}
function enlaceARep(){
  const src=(location.hash||"")+"&"+(location.search||"");
  const m=src.match(/[#&?]r=([A-Za-z0-9_-]+)/); if(!m) return null;
  try{const c=JSON.parse(unb64u(m[1]));(c.x||[]).forEach(k=>{if(k&&k.id)linkSongs[String(k.id)]=k});return {t:c.t||"",d:c.d||"",p:(c.p||[]).map(x=>({k:x[0],s:(x[1]||[]).map(String),nota:x[2]||""}))}}catch{return null}
}
